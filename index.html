function isOrphan(roster) {
  return !roster.owner_id || !STATE.leagueUsers[roster.owner_id];
}

function getRosterOwner(roster) {
  const u = STATE.leagueUsers[roster.owner_id];
  const orphan = isOrphan(roster);
  return {
    teamName: (orphan ? '⚠️ ' : '') + (u?.metadata?.team_name || u?.display_name || 'Orphan Roster ' + roster.roster_id),
    owner: u?.display_name || '—',
    avatar: u?.avatar || '',
    orphan,
  };
}

// v2.3: derive a human-readable trade log from raw transactions (type === 'trade').
// Raw transactions only carry roster_ids/player_ids — this resolves team names and player names
// and groups players/picks sent vs. received per team for each trade.
// v3.0: Trade analyzer upgrade. Each completed trade is now scored using the
// same getPlayerValue()/pickEstimatedValue() math used everywhere else in the
// tool (no separate/duplicate valuation logic). A side's value is null (not 0)
// if ANY asset on that side lacks data, so we never silently understate a side.
function scoreTradeSide(received, totalRosters, currentSeason) {
  let total = 0;
  let hasUnknown = false;
  const lines = received.map(item => {
    if (item.kind === 'player') {
      const v = getPlayerValue(item.pid);
      if (v === null) hasUnknown = true; else total += v;
      return { ...item, value: v };
    } else {
      // v3.1: use scaledPickValue() (pick value scaled onto player-value scale)
      // instead of raw pickEstimatedValue(), to fix the scale mismatch where
      // pick values (0-100) were combined with player values (150-300+)
      // without normalization.
      const v = scaledPickValue({ ...item.pickInfo, totalRosters, currentSeason });
      if (v === null) hasUnknown = true; else total += v;
      return { ...item, value: v };
    }
  });
  return { lines, total: Math.round(total * 100) / 100, hasUnknown };
}

function buildTradeLog() {
  const teamName = rid => {
    const r = STATE.rosters.find(rr => rr.roster_id === rid);
    return r ? getRosterOwner(r).teamName : 'Roster ' + rid;
  };
  const playerName = pid => {
    const p = STATE.playerDB[pid];
    return p ? (p.full_name || (p.first_name ? `${p.first_name} ${p.last_name}` : pid)) : pid;
  };
  const totalRosters = STATE.activeLeague?.total_rosters || STATE.rosters.length;
  const currentSeason = STATE.currentSeason;
  return (STATE.transactions || [])
    .filter(tx => tx.type === 'trade' && tx.status === 'complete')
    .sort((a, b) => (b.created || 0) - (a.created || 0))
    .map(tx => {
      const rosterIds = tx.roster_ids || [];
      const teams = rosterIds.map(rid => {
        const playersIn = tx.adds ? Object.entries(tx.adds).filter(([, r]) => r === rid).map(([pid]) => ({ kind: 'player', pid, label: playerName(pid) })) : [];
        const playersOut = tx.drops ? Object.entries(tx.drops).filter(([, r]) => r === rid).map(([pid]) => ({ kind: 'player', pid, label: playerName(pid) })) : [];
        const picksIn = (tx.draft_picks || []).filter(pk => pk.owner_id === rid).map(pk => ({ kind: 'pick', pickInfo: { season: pk.season, round: pk.round }, label: `${pk.season} Rd${pk.round}` }));
        const picksOut = (tx.draft_picks || []).filter(pk => pk.previous_owner_id === rid).map(pk => ({ kind: 'pick', pickInfo: { season: pk.season, round: pk.round }, label: `${pk.season} Rd${pk.round}` }));
        const received = [...playersIn, ...picksIn];
        const sent = [...playersOut, ...picksOut];
        const scoredReceived = scoreTradeSide(received, totalRosters, currentSeason);
        return {
          roster_id: rid,
          team_name: teamName(rid),
          received: received.map(r => r.label),
          sent: sent.map(s => s.label),
          value_received: scoredReceived.total,
          value_received_has_unknown: scoredReceived.hasUnknown,
        };
      });
      // Winner = highest value_received minus what they sent away (net gain), only
      // when no side has unknown/missing valuation data — never guess a winner
      // off incomplete inputs.
      let winner = null;
      let verdict = 'INSUFFICIENT_DATA';
      const anyUnknown = teams.some(t => t.value_received_has_unknown);
      if (!anyUnknown && teams.length === 2) {
        const diff = teams[0].value_received - teams[1].value_received;
        if (Math.abs(diff) <= 15) {
          verdict = 'FAIR';
        } else {
          winner = diff > 0 ? teams[0].team_name : teams[1].team_name;
          verdict = `${winner} +${Math.abs(Math.round(diff * 100) / 100)} value`;
        }
      }
      return {
        date: tx.created ? new Date(tx.created).toISOString() : null,
        week: tx.leg ?? null,
        teams,
        verdict,
      };
    });
}

// v3.0: Standalone hypothetical-trade analyzer. Evaluates a proposed trade not
// yet executed — sideA/sideB are arrays of { kind: 'player', pid } or
// { kind: 'pick', pickInfo: { season, round, slot } }. Returns scored sides and
// a verdict using the same math as buildTradeLog(), so live/hypothetical and
// historical trades are always judged on the same scale.
function evaluateTrade(sideA, sideB, labelA = 'Side A', labelB = 'Side B') {
  const totalRosters = STATE.activeLeague?.total_rosters || STATE.rosters.length;
  const currentSeason = STATE.currentSeason;
  const scoredA = scoreTradeSide(sideA || [], totalRosters, currentSeason);
  const scoredB = scoreTradeSide(sideB || [], totalRosters, currentSeason);
  let verdict = 'INSUFFICIENT_DATA';
  if (!scoredA.hasUnknown && !scoredB.hasUnknown) {
    const diff = scoredA.total - scoredB.total;
    if (Math.abs(diff) <= 15) verdict = 'FAIR';
    else verdict = diff > 0 ? `${labelA} wins by ${Math.round(diff * 100) / 100}` : `${labelB} wins by ${Math.abs(Math.round(diff * 100) / 100)}`;
  }
  return {
    side_a: { label: labelA, lines: scoredA.lines, total: scoredA.total, has_unknown: scoredA.hasUnknown },
    side_b: { label: labelB, lines: scoredB.lines, total: scoredB.total, has_unknown: scoredB.hasUnknown },
    verdict,
  };
}

function renderTeamsTable() {
  const sorted = [...STATE.rosters].sort((a, b) => {
    const ar = a.settings || {}, br = b.settings || {};
    if ((br.wins || 0) !== (ar.wins || 0)) return (br.wins || 0) - (ar.wins || 0);
    return (br.fpts || 0) - (ar.fpts || 0);
  });
  const tbody = document.getElementById('teams-tbody');
  tbody.innerHTML = '';
  sorted.forEach((r, i) => {
    const { teamName, owner } = getRosterOwner(r);
    const s = r.settings || {};
    const rank = i + 1;
    const badgeClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const pf = fmtPts(s.fpts, s.fpts_decimal);
    const pa = fmtPts(s.fpts_against, s.fpts_against_decimal);
    const streak = (!s.wins && !s.losses && !s.ties) ? '—' : s.streak_type === 'W' ? `<span style="color:var(--success)">W${s.streak_count||1}</span>` : `<span style="color:var(--danger)">L${s.streak_count||1}</span>`;
    const rosterPositions = STATE.activeLeague.roster_positions || [];
    const expectedSize = rosterPositions.length;
    const actualSize = (r.players || []).length;
    const sizeFlag = expectedSize > 0 && actualSize !== expectedSize ? ` <span style="color:var(--warn);font-size:11px;" title="Roster size: ${actualSize}/${expectedSize}">⚠️${actualSize}</span>` : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="rank-badge ${badgeClass}">${rank}</span></td>
      <td style="font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(teamName)}${sizeFlag}</td>
      <td style="color:var(--text2);">${esc(owner)}</td>
      <td class="record">${s.wins||0}-${s.losses||0}${s.ties ? '-'+s.ties : ''}</td>
      <td class="pts">${pf}</td>
      <td class="pts">${pa}</td>
      <td>${streak}</td>
      <td>
        <div class="team-btns">
          <button onclick="openTeamPacket(${r.roster_id})">📋 Packet</button>
          <button onclick="openTeamPacketLean(${r.roster_id})" style="font-size:11px;">📄 Lean</button>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

function fmtPts(whole, dec) {
  if (whole === undefined || whole === null) return '—';
  const d = dec !== undefined && dec !== null ? dec : 0;
  return (whole + d / 100).toFixed(2);
}

// ══════════════════════════════════════════════
//  TEAM PACKETS
// ══════════════════════════════════════════════
function openTeamPacket(rosterId) {
  const roster = STATE.rosters.find(r => r.roster_id === rosterId);
  if (!roster) return;
  const { teamName, owner } = getRosterOwner(roster);
  const players = roster.players || [];
  const starters = new Set(roster.starters || []);
  const taxi = new Set(roster.taxi || []);
  const ir = new Set(roster.reserve || []);

  const groups = { STARTER: [], BENCH: [], TAXI: [], IR: [] };
  players.forEach(pid => {
    if (ir.has(pid)) groups.IR.push(pid);
    else if (taxi.has(pid)) groups.TAXI.push(pid);
    else if (starters.has(pid)) groups.STARTER.push(pid);
    else groups.BENCH.push(pid);
  });

  const s = roster.settings || {};
  const rosterPositions = STATE.activeLeague.roster_positions || [];
  const expectedSize = rosterPositions.length;
  const actualSize = players.length;
  const sizeViolation = expectedSize > 0 && actualSize !== expectedSize;

  let text = `=== ${teamName} | Owner: ${owner} ===\n`;
  text += `League: ${STATE.activeLeague.name} | Season: ${STATE.currentSeason}\n`;
  text += `Record: ${s.wins||0}-${s.losses||0} | PF: ${fmtPts(s.fpts, s.fpts_decimal)}\n`;
  if (sizeViolation) {
    text += `⚠️ ROSTER SIZE VIOLATION: ${actualSize} players (expected ${expectedSize})\n`;
  }
  text += '\n';

  const CONDENSED_KEYS = { QB:['pts','proj'], RB:['pts','proj','age'], WR:['pts','proj','age'], TE:['pts','proj','age'], DL:['pts','proj'], LB:['pts','proj'], DB:['pts','proj'] };

  const renderGroup = (label, pids) => {
    if (!pids.length) return '';
    let out = `--- ${label} ---\n`;
    const ptsHdr = `Pts(${STATE.statsSeason})`;
    const projHdr = `Proj(Wk${STATE.currentWeek})`;
    if (STATE.condensedStats) {
      out += `${'Player'.padEnd(26)} ${'Pos'.padEnd(5)} ${'NFL'.padEnd(6)} ${ptsHdr.padEnd(10)} ${projHdr}\n`;
    } else {
      out += `${'Player'.padEnd(26)} ${'Pos'.padEnd(5)} ${'NFL'.padEnd(6)} ${ptsHdr.padEnd(12)} ${projHdr.padEnd(10)} ${'Age'.padEnd(4)} Exp\n`;
    }
    out += '-'.repeat(STATE.condensedStats ? 58 : 72) + '\n';
    pids.forEach(pid => {
      const p = STATE.playerDB[pid] || {};
      const name = (p.full_name || (p.first_name && p.last_name ? `${p.first_name} ${p.last_name}` : pid)).slice(0, 25);
      const pos = (p.position || '?').slice(0, 4);
      const nfl = p.team ? p.team.slice(0, 4) : '[FA]';
      const pts = STATE.playerStats[pid] !== undefined ? STATE.playerStats[pid].toFixed(1) : '—';
      const proj = STATE.projections[pid] !== undefined ? STATE.projections[pid].toFixed(1) : '—';
      if (STATE.condensedStats) {
        out += `${name.padEnd(26)} ${pos.padEnd(5)} ${nfl.padEnd(6)} ${pts.padEnd(10)} ${proj}\n`;
      } else {
        const age = p.age ? String(p.age) : '—';
        const exp = p.years_exp !== undefined ? String(p.years_exp) : '—';
        out += `${name.padEnd(26)} ${pos.padEnd(5)} ${nfl.padEnd(6)} ${pts.padEnd(12)} ${proj.padEnd(10)} ${age.padEnd(4)} ${exp}\n`;
      }
    });
    return out + '\n';
  };

  text += renderGroup('STARTERS', groups.STARTER);
  text += renderGroup('BENCH', groups.BENCH);
  if (groups.TAXI.length) text += renderGroup('TAXI', groups.TAXI);
  if (groups.IR.length) text += renderGroup('IR / RESERVE', groups.IR);

  openModal(`${teamName} — Full Packet`, text);
}

function openGlobalPacket(type) {
  switch(type) {
    case 'info':      openModal('League Info', buildPacketInfo()); break;
    case 'standings': openModal('Standings', buildPacketStandings()); break;
    case 'matchups':  openModal('Matchup History', buildPacketMatchups()); break;
    case 'fa':        openModal('Free Agents', buildPacketFA()); break;
    case 'transactions': openModal('Transactions', buildPacketTransactions()); break;
    case 'draft':     openModal('Draft Picks', buildPacketDraftPicks()); break;
    case 'power':     openModal('Power Rankings', buildPacketPower()); break;
    case 'prevseason': openModal('Prior Season', buildPacketPrevSeason()); break;
    case 'ageprofile': openModal('Age / Experience Profile', buildPacketAgeProfile()); break;
  }
}

function openRostersMenu() {
  const parts = getRostersPartCount();
  if (parts <= 1) {
    openModal('All Rosters', buildPacketRosters(0));
    return;
  }
  const labels = ['A','B','C','D','E'];
  // Build a small chooser text and open first part, with note about parts
  const partLabel = (i) => `Rosters ${labels[i] || (i+1)} (Teams ${i*10+1}–${Math.min((i+1)*10, STATE.rosters.length)})`;
  // Open part chooser via modal with part buttons
  const chooser = Array.from({length: parts}, (_,i) =>
    `[Part ${labels[i] || i+1}] ${partLabel(i)}`
  ).join('\n');
  // Open first part immediately, show hint
  openModal(partLabel(0) + ' — use buttons below for other parts', buildPacketRosters(0));
  // Inject part-switcher buttons into modal header area
  setTimeout(() => {
    const existing = document.getElementById('roster-part-btns');
    if (existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.id = 'roster-part-btns';
    wrap.style.cssText = 'display:flex;gap:6px;padding:8px 20px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap;';
    for (let i = 0; i < parts; i++) {
      const btn = document.createElement('button');
      btn.className = 'btn-sm';
      btn.textContent = `Part ${labels[i] || i+1} (${i*10+1}–${Math.min((i+1)*10, STATE.rosters.length)})`;
      btn.onclick = () => {
        document.getElementById('modal-textarea').value = buildPacketRosters(i);
        document.getElementById('modal-title').textContent = partLabel(i);
      };
      wrap.appendChild(btn);
    }
    document.getElementById('modal-body').prepend(wrap);
  }, 0);
}

function buildPacketInfo() {
  const lg = STATE.activeLeague;
  const s = lg.settings || {};
  const sc = lg.scoring_settings || {};
  let t = `=== LEAGUE INFO ===\n`;
  t += `Name: ${lg.name}\n`;
  t += `Season: ${STATE.currentSeason} | Current Week: ${STATE.currentWeek}\n`;
  t += `Teams: ${lg.total_rosters} | Format: ${s.type === 2 ? 'Dynasty' : s.type === 1 ? 'Keeper' : 'Redraft'}\n`;
  t += `Scoring: ${getScoringLabel(lg)}\n`;
  t += `Roster Positions: ${(lg.roster_positions || []).join(', ')}\n`;
  t += `Playoff Teams: ${s.playoff_teams || '—'} | Playoff Start Week: ${s.playoff_week_start || '—'}\n`;
  t += `Waiver Type: ${s.waiver_type === 0 ? 'Rolling' : s.waiver_type === 2 ? 'FAAB' : 'Standard'}\n`;
  if (s.waiver_type === 2) t += `FAAB: $${s.waiver_budget || 100}\n`;
  t += `Max Keepers: ${s.max_keepers !== undefined ? s.max_keepers : '—'}\n`;

  // Divisions
  if (s.divisions && s.divisions > 1) {
    t += `\n--- DIVISIONS (${s.divisions}) ---\n`;
    STATE.rosters.forEach(r => {
      const { teamName } = getRosterOwner(r);
      const div = r.settings?.division !== undefined ? `Division ${r.settings.division}` : '—';
      t += `  ${teamName.padEnd(26)} ${div}\n`;
    });
  }

  // Scoring settings grouped by category
  const SCORING_CATS = {
    'Passing': ['pass_yd','pass_td','pass_int','pass_2pt','pass_sack','pass_cmp','pass_inc','bonus_pass_yd_300','bonus_pass_yd_400'],
    'Rushing': ['rush_yd','rush_td','rush_2pt','rush_att','bonus_rush_yd_100','bonus_rush_yd_200'],
    'Receiving': ['rec','rec_yd','rec_td','rec_2pt','rec_tgt','bonus_rec_yd_100','bonus_rec_yd_200','bonus_rec_te'],
    'Misc Offense': ['fum_lost','fum_rec_td','st_td','st_ff','st_fum_rec','pr_td','kr_td'],
    'Kicking': ['fgm','fgm_0_19','fgm_20_29','fgm_30_39','fgm_40_49','fgm_50p','fgmiss','xpm','xpmiss'],
    'IDP Defense': ['idp_solo','idp_asst','idp_sack','idp_int','idp_fum_rec','idp_pd','idp_td','idp_safe','idp_blk_kick','idp_ff'],
  };
  const used = new Set();
  t += `\n--- SCORING SETTINGS ---\n`;
  for (const [cat, keys] of Object.entries(SCORING_CATS)) {
    const matches = keys.filter(k => sc[k] !== undefined && sc[k] !== 0);
    if (!matches.length) continue;
    t += `  [${cat}]\n`;
    matches.forEach(k => { t += `    ${k}: ${sc[k]}\n`; used.add(k); });
  }
  // Catch-all for any remaining keys not in categories
  const remaining = Object.entries(sc).filter(([k,v]) => v !== 0 && !used.has(k));
  if (remaining.length) {
    t += `  [Other]\n`;
    remaining.forEach(([k,v]) => { t += `    ${k}: ${v}\n`; });
  }
  return t;
}

function buildPacketStandings() {
  const lg = STATE.activeLeague;
  const s = lg.settings || {};
  const hasDivisions = s.divisions && s.divisions > 1;

  const sorted = [...STATE.rosters].sort((a, b) => {
    const aw = a.settings?.wins || 0, bw = b.settings?.wins || 0;
    if (bw !== aw) return bw - aw;
    return (b.settings?.fpts || 0) - (a.settings?.fpts || 0);
  });

  let t = `=== STANDINGS — ${STATE.activeLeague.name} (${STATE.currentSeason}) ===\n\n`;

  const renderRows = (rosters, offset) => {
    let out = `${'#'.padEnd(3)} ${'Team'.padEnd(24)} ${'Owner'.padEnd(18)} ${'W-L-T'.padEnd(8)} ${'PF'.padEnd(9)} ${'PA'.padEnd(9)} Streak\n`;
    out += '-'.repeat(80) + '\n';
    rosters.forEach((r, i) => {
      const { teamName, owner } = getRosterOwner(r);
      const rs = r.settings || {};
      const rec = `${rs.wins||0}-${rs.losses||0}${rs.ties?'-'+rs.ties:''}`;
      const pf = fmtPts(rs.fpts, rs.fpts_decimal);
      const pa = fmtPts(rs.fpts_against, rs.fpts_against_decimal);
      const str = (!rs.wins && !rs.losses && !rs.ties) ? '—' : (rs.streak_type || 'W') + (rs.streak_count || 1);
      out += `${String(offset + i + 1).padEnd(3)} ${teamName.slice(0,23).padEnd(24)} ${owner.slice(0,17).padEnd(18)} ${rec.padEnd(8)} ${pf.padEnd(9)} ${pa.padEnd(9)} ${str}\n`;
    });
    return out;
  };

  if (hasDivisions) {
    // Group by division number
    const divMap = {};
    sorted.forEach(r => {
      const div = r.settings?.division !== undefined ? r.settings.division : 0;
      if (!divMap[div]) divMap[div] = [];
      divMap[div].push(r);
    });
    // Sort within each division by wins then PF (already sorted globally, filter maintains order)
    const divNums = Object.keys(divMap).map(Number).sort((a,b) => a-b);
    let globalRank = 0;
    for (const div of divNums) {
      const divRosters = divMap[div].sort((a,b) => {
        const aw = a.settings?.wins||0, bw = b.settings?.wins||0;
        if (bw !== aw) return bw - aw;
        return (b.settings?.fpts||0) - (a.settings?.fpts||0);
      });
      t += `--- DIVISION ${div} ---\n`;
      t += renderRows(divRosters, 0);
      globalRank += divRosters.length;
      t += '\n';
    }
    t += `--- OVERALL ---\n`;
    t += renderRows(sorted, 0);
  } else {
    t += renderRows(sorted, 0);
  }
  return t;
}

function buildPacketMatchups() {
  let t = `=== MATCHUP HISTORY — ${STATE.activeLeague.name} ===\n`;
  const weeks = Object.keys(STATE.matchupsByWeek).map(Number).sort((a,b)=>a-b);
  if (!weeks.length) {
    t += `Season: ${STATE.currentSeason} | Status: Pre-season (no matchups played yet)\n`;
    return t;
  }
  t += `Season: ${STATE.currentSeason} | Weeks loaded: ${weeks.join(', ')}\n\n`;
  // Slim display: Wk | Team A pts > pts Team B | WINNER
  t += `${'Wk'.padEnd(4)} ${'Winner'.padEnd(24)} ${'Score'.padEnd(16)} Loser\n`;
  t += '-'.repeat(72) + '\n';
  for (const week of weeks) {
    const matchups = STATE.matchupsByWeek[week] || [];
    if (!matchups.length) continue;
    const byId = {};
    matchups.forEach(m => {
      if (!byId[m.matchup_id]) byId[m.matchup_id] = [];
      byId[m.matchup_id].push(m);
    });
    for (const [mid, pair] of Object.entries(byId)) {
      if (pair.length < 2) continue;
      let [a, b] = pair;
      if ((a.points || 0) < (b.points || 0)) [a, b] = [b, a]; // a = winner
      const ra = STATE.rosters.find(r => r.roster_id === a.roster_id);
      const rb = STATE.rosters.find(r => r.roster_id === b.roster_id);
      const na = (ra ? getRosterOwner(ra).teamName : 'Team ' + a.roster_id).slice(0, 23);
      const nb = (rb ? getRosterOwner(rb).teamName : 'Team ' + b.roster_id).slice(0, 23);
      const pa = (a.points || 0).toFixed(2);
      const pb = (b.points || 0).toFixed(2);
      const score = `${pa}-${pb}`;
      t += `${String(week).padEnd(4)} ${na.padEnd(24)} ${score.padEnd(16)} ${nb}\n`;
    }
  }
  return t;
}

function buildPacketRosters(groupIndex) {
  const sorted = [...STATE.rosters].sort((a, b) => {
    return (b.settings?.wins || 0) - (a.settings?.wins || 0);
  });
  const chunkSize = 10;
  const chunks = [];
  for (let i = 0; i < sorted.length; i += chunkSize) chunks.push(sorted.slice(i, i + chunkSize));
  const chunk = chunks[groupIndex] || chunks[0] || [];
  const label = chunks.length > 1 ? ` (Part ${groupIndex + 1}/${chunks.length})` : '';
  let t = `=== ALL ROSTERS — ${STATE.activeLeague.name} (${STATE.currentSeason})${label} ===\n\n`;
  chunk.forEach(r => {
    const { teamName, owner } = getRosterOwner(r);
    const s = r.settings || {};
    t += `--- ${teamName} (${owner}) | ${s.wins||0}-${s.losses||0} | PF: ${fmtPts(s.fpts, s.fpts_decimal)} ---\n`;
    const starters = new Set(r.starters || []);
    const taxi = new Set(r.taxi || []);
    const ir = new Set(r.reserve || []);
    const players = r.players || [];
    const groups = { STARTER: [], BENCH: [], TAXI: [], IR: [] };
    players.forEach(pid => {
      if (ir.has(pid)) groups.IR.push(pid);
      else if (taxi.has(pid)) groups.TAXI.push(pid);
      else if (starters.has(pid)) groups.STARTER.push(pid);
      else groups.BENCH.push(pid);
    });
    for (const [gname, pids] of Object.entries(groups)) {
      if (!pids.length) continue;
      t += `  [${gname}]\n`;
      pids.forEach(pid => {
        const p = STATE.playerDB[pid] || {};
        const name = p.full_name || (p.first_name ? `${p.first_name} ${p.last_name}` : pid);
        const pos = p.position || '?';
        const nfl = p.team || '[FA]';
        const proj = STATE.projections[pid] !== undefined ? STATE.projections[pid].toFixed(1) : '—';
        const pts = STATE.playerStats[pid] !== undefined ? STATE.playerStats[pid].toFixed(1) : '—';
        t += `    ${name} | ${pos} | ${nfl} | Pts(${STATE.statsSeason}): ${pts} | Proj: ${proj}\n`;
      });
    }
    t += '\n';
  });
  return t;
}

function getRostersPartCount() {
  return Math.ceil(STATE.rosters.length / 10);
}

function buildPacketFA() {
  const rostered = new Set();
  STATE.rosters.forEach(r => (r.players || []).forEach(pid => rostered.add(pid)));
  const fas = [];
  for (const [pid, player] of Object.entries(STATE.playerDB)) {
    if (rostered.has(pid)) continue;
    // Include any player with an active NFL team, or with prior season pts, or with a projection
    if (!player.team && !STATE.playerStats[pid] && !STATE.projections[pid] && player.status !== 'Active') continue; // v4.3: don't drop active players missing team/stats/proj (e.g. Saquon Barkley export gap)
    const proj = STATE.projections[pid] || 0;
    const pts = STATE.playerStats[pid] || 0;
    fas.push({ pid, player, proj, pts });
  }
  // Sort by prior season pts desc, then proj desc as tiebreaker
  fas.sort((a, b) => (b.pts !== a.pts) ? b.pts - a.pts : b.proj - a.proj);
  let t = `=== FREE AGENTS — ${STATE.activeLeague.name} ===\n`;
  t += `ALL unrostered players (${fas.length} available) | Stats: ${STATE.statsSeason} season | Proj: Week ${STATE.currentWeek} ${STATE.currentSeason}\n\n`;
  t += `${'#'.padEnd(4)} ${'Player'.padEnd(26)} ${'Pos'.padEnd(5)} ${'NFL'.padEnd(5)} ${'Pts('+STATE.statsSeason+')'.padEnd(12)} ${'Proj'.padEnd(8)} Age\n`;
  t += '-'.repeat(68) + '\n';
  fas.forEach((fa, i) => {
    const p = fa.player;
    const name = (p.full_name || (p.first_name ? `${p.first_name} ${p.last_name}` : fa.pid)).slice(0, 25);
    const pos = (p.position || '?').slice(0, 4);
    const nfl = p.team ? p.team.slice(0, 4) : '[FA]';
    const pts = fa.pts > 0 ? fa.pts.toFixed(1) : '—';
    const proj = fa.proj > 0 ? fa.proj.toFixed(2) : '—';
    const age = p.age ? String(p.age) : '—';
    t += `${String(i+1).padEnd(4)} ${name.padEnd(26)} ${pos.padEnd(5)} ${nfl.padEnd(5)} ${pts.padEnd(12)} ${proj.padEnd(8)} ${age}\n`;
  });
  return t;
}

function buildPacketTransactions() {
  let t = `=== TRANSACTIONS — ${STATE.activeLeague.name} ===\n`;
  t += `Week: ${Math.max(1, STATE.currentWeek - 1)} (most recent batch)\n\n`;
  const txs = STATE.transactions || [];
  if (!txs.length) return t + 'No transactions found.\n';
  const sorted = [...txs].sort((a, b) => (b.created || 0) - (a.created || 0));
  sorted.slice(0, 50).forEach(tx => {
    const date = tx.created ? new Date(tx.created).toLocaleDateString() : '—';
    const typeLabel = tx.type === 'trade' ? 'TRADE' : tx.type === 'free_agent' ? 'FA' : tx.type === 'waiver' ? 'WAIVER' : tx.type?.toUpperCase() || 'TX';
    t += `[${typeLabel}] ${date}\n`;
    if (tx.adds && Object.keys(tx.adds).length) {
      for (const [pid, rid] of Object.entries(tx.adds)) {
        const p = STATE.playerDB[pid] || {};
        const roster = STATE.rosters.find(r => r.roster_id === rid);
        const team = roster ? getRosterOwner(roster).teamName : 'Team ' + rid;
        const pname = p.full_name || (p.first_name ? `${p.first_name} ${p.last_name}` : pid);
        t += `  ADD: ${pname} → ${team}\n`;
      }
    }
    if (tx.drops && Object.keys(tx.drops).length) {
      for (const [pid, rid] of Object.entries(tx.drops)) {
        const p = STATE.playerDB[pid] || {};
        const pname = p.full_name || (p.first_name ? `${p.first_name} ${p.last_name}` : pid);
        t += `  DROP: ${pname}\n`;
      }
    }
    if (tx.draft_picks && tx.draft_picks.length) {
      tx.draft_picks.forEach(pk => {
        t += `  PICK: ${pk.season} Rd${pk.round}\n`;
      });
    }
    t += '\n';
  });
  return t;
}

function buildPacketDraftPicks() {
  let t = `=== DRAFT PICK ASSETS — ${STATE.activeLeague.name} ===\n`;
  t += `Type: ${STATE.activeLeague.settings?.type === 2 ? 'Dynasty' : 'Standard'}\n\n`;
  const picks = STATE.tradedPicks || [];
  if (!picks.length) {
    t += 'No traded future picks on record (or dynasty picks API returned empty).\n';
    t += '\nNote: Each team owns their own picks unless traded.\n';
    return t;
  }
  // In the traded_picks API, owner_id and roster_id are both roster_id values (integers)
  // Must match against roster.roster_id, not roster.owner_id
  const getRosterByRosterId = (id) => STATE.rosters.find(r => r.roster_id === id || r.roster_id === Number(id));

  // Group by owner roster_id
  const byOwner = {};
  picks.forEach(pk => {
    const key = pk.owner_id;
    if (!byOwner[key]) byOwner[key] = [];
    byOwner[key].push(pk);
  });

  // Sort by team name for clean output
  const sorted = Object.entries(byOwner).sort(([aId], [bId]) => {
    const ra = getRosterByRosterId(aId);
    const rb = getRosterByRosterId(bId);
    const na = ra ? getRosterOwner(ra).teamName : 'ZZZ';
    const nb = rb ? getRosterOwner(rb).teamName : 'ZZZ';
    return na.localeCompare(nb);
  });

  for (const [ownerId, pks] of sorted) {
    const ownerRoster = getRosterByRosterId(ownerId);
    const teamName = ownerRoster ? getRosterOwner(ownerRoster).teamName : 'Unknown Team (roster ' + ownerId + ')';
    t += `--- ${teamName} ---\n`;
    // Sort picks by season then round
    const sortedPks = [...pks].sort((a, b) => a.season !== b.season ? a.season - b.season : a.round - b.round);
    sortedPks.forEach(pk => {
      const origRoster = getRosterByRosterId(pk.roster_id);
      const origTeam = origRoster ? getRosterOwner(origRoster).teamName : 'Team ' + pk.roster_id;
      t += `  ${pk.season} Round ${pk.round} (from ${origTeam})\n`;
    });
    t += '\n';
  }
  return t;
}

function buildPacketPower() {
  const sorted = [...STATE.rosters].sort((a, b) => {
    const aProj = totalRosterProj(a);
    const bProj = totalRosterProj(b);
    const aPf = parseFloat(fmtPts(a.settings?.fpts, a.settings?.fpts_decimal)) || 0;
    const bPf = parseFloat(fmtPts(b.settings?.fpts, b.settings?.fpts_decimal)) || 0;
    // Combined score: 60% projection + 40% normalized PF
    return (bProj * 0.6 + bPf * 0.4) - (aProj * 0.6 + aPf * 0.4);
  });
  let t = `=== POWER RANKINGS — ${STATE.activeLeague.name} ===\n`;
  t += `Based on season PF + current week projections\n\n`;
  t += `${'#'.padEnd(3)} ${'Team'.padEnd(24)} ${'Owner'.padEnd(18)} ${'Record'.padEnd(8)} ${'PF'.padEnd(9)} Proj(Wk${STATE.currentWeek})\n`;
  t += '-'.repeat(80) + '\n';
  sorted.forEach((r, i) => {
    const { teamName, owner } = getRosterOwner(r);
    const s = r.settings || {};
    const rec = `${s.wins||0}-${s.losses||0}`;
    const pf = fmtPts(s.fpts, s.fpts_decimal);
    const proj = totalRosterProj(r).toFixed(2);
    t += `${String(i+1).padEnd(3)} ${teamName.slice(0,23).padEnd(24)} ${owner.slice(0,17).padEnd(18)} ${rec.padEnd(8)} ${pf.padEnd(9)} ${proj}\n`;
  });
  return t;
}

// v4.2: Added is_keeper capture/export. Sleeper's draft-picks payload includes a per-pick
// is_keeper field (true/false/null) that the tool was fetching (for auction_cost) but discarding.
// Keeper leagues (e.g. PLAYERZ BALL 2026) need to distinguish "this player was kept from last
// season" from "this player was freshly drafted/auctioned this year" — auction_cost alone can't
// do that, since a kept player's cost reflects what he cost when ORIGINALLY acquired, which looks
// identical in shape to a fresh pick's cost. is_keeper is now captured everywhere auction_cost
// already was (prior-season draft picks, current-season draft/auction picks, FAAB/waiver adds —
// which are always explicit false, never keeper picks) and surfaced on: rostered players (was
// missing auction_cost AND is_keeper entirely), resolveMyPlayers, and the live picks_made_log
// (pulled directly from the pick object, not the aggregated map, since that's the authoritative
// per-pick source). Also added summary.keepers_flagged_count so a consumer can tell at a glance
// whether Sleeper actually returned keeper data for this league before relying on is_keeper being
// non-null anywhere. IMPORTANT: is_keeper null means "Sleeper reported nothing for this player,"
// not "confirmed not a keeper" — only explicit false means that. Never treat null as false.
//
// v4.4: Fixed a gap in the v4.3 DEF patch — the DEF stat keys (sack/int/fum_rec/ff/safe/
// blk_kick/def_td) were added to POS_STAT_KEYS (which selects which keys get output into
// season_stat_history.stats) but not to ACCUM_STAT_KEYS (the separate hardcoded list that
// actually sums raw weekly values into entry.acc). Result: season_stat_history.stats for
// every DEF was populating but showing all zeros — gp/pts_history were correct (those don't
// go through this accumulator), only the stat breakdown was empty. Fix: added the same 7
// keys to ACCUM_STAT_KEYS.
// v4.3: Three fixes, all from the same class of "DEF was never accounted for" gap:
// (1) DEF stats blackout — POS_STAT_KEYS had no DEF entry, so the v4.0/v4.1
// hasStatProduction corroboration check fell back to SPLIT_KEYS (offense/IDP fields
// only, no sack/int/fum_rec/ff/safe/blk_kick/def_td), making hasStatProduction always
// false for every team defense. Result: didPlay was always false for DEF, silently
// zeroing out games_played_history/pts_history/season_stat_history/weekly_trend for
// every DEF in every export. Fix: added a DEF entry to POS_STAT_KEYS (for
// season_stat_history.stats) AND carved DEF out of the hasStatProduction requirement
// entirely in both loops (~line 1617 season-history, ~line 1531 weekly-trend) — a real,
// fully-played defensive game can legitimately record zero of those events (a shutout
// loss with no sacks/turnovers/blocks), so unlike an individual player, gp alone is a
// reliable played signal for a team unit.
// (2) Free-agent/positional_availability exclusion filter (5 locations) dropped a
// player if team, playerStats, AND projections were all empty — which happens for any
// player, including active rostered ones, in a preseason export before stats/proj
// exist. Confirmed case: Saquon Barkley missing from two live PLAYERZ BALL 2026 auction
// exports 23 min apart despite being visibly available on Sleeper's board — his
// playerDB entry had a blank team field at export time, so he failed all three checks.
// Fix: added "&& player.status !== 'Active'" so an explicitly active player is never
// dropped regardless of team/stats/projection gaps.
// (3) Free-agent per-position cap whitelist (2 locations) was missing 'DEF', so
// posCap.DEF was never populated from the league's real roster_positions and silently
// defaulted to a 1-slot cap basis. Not currently visible (32 real team defenses sit
// well under the default's ~56-cap ceiling at FA_CAP_MULT=3.5), but wrong if a league
// ever carries 2+ DEF slots. Fix: added 'DEF' to both whitelist arrays.
//
// v4.1: The v4.0 fix below only tightened the branch where Sleeper's weekly payload includes
// an explicit 'gp' field. Players on IR for a season-ending injury frequently get weekly entries
// that OMIT 'gp' entirely (rather than gp:0) once inactive, which fell through to the untouched
// 'else' fallback — originally written for untracked positions (OL/FB/LS/P) — that only checked
// "tracked position + any key present," with no requirement that the key reflect real production.
// Confirmed case: Micah McFadden (LB, 2025) suffered a Week 1 season-ending foot injury (1 real
// game played) but games_played_history.most_recent_season still read 17, because his post-injury
// weekly entries had no 'gp' key and fell into the loose fallback. Season stat totals (1 solo
// tackle + 1 assist) correctly reflected only 1 game, exposing the gp-counter/stat-accumulator
// mismatch. Fix: both branches (season-history loop at ~line 1610 and weekly_trend loop at
// ~line 1524) now require the same hasStatProduction corroboration regardless of whether 'gp'
// is present, closing the gap for IR/season-ending-injury players.
// v4.0: Fixed games_played_history / durability_flag / weekly_trend inflation for players who
// missed most or all of a season on IR. Root cause: both the season-history loop and the weekly
// playerStats loop treated Sleeper's per-week 'gp' field as a reliable "this player suited up"
// signal, but gp can read >0 for a week even when the player recorded zero production — it
// appears to reflect that the player's team had a game that week, not that the player himself
// played. Confirmed case: a player who suffered a Week 1 season-ending injury (1 real game played)
// was showing games_played_history.most_recent_season = 17, massively overstating durability and
// making his rock-bottom point total look like a lost role/bad year rather than a lost season.
// Fix: gp>0 is no longer sufficient on its own — also require at least one nonzero tracked stat
// that week as corroborating evidence of actual participation (see hasStatProduction in both
// loops). Also patched an equivalent oversight that would've allowed the same bug to leak into
// STATE.weeklyPts (used for weekly_trend), which shares the identical gp-only pattern.
// v3.11: renamed games_played_history/pts_history/season_stat_history's 'current_season' key to
// 'most_recent_season' (see buildDurabilityProfile below). These fields are anchored to
// STATE.statsSeason (currentSeason - 1), so 'current_season' never actually meant the real current
// season — it meant the most recent completed one. That collided in naming (not in value — no bug
// existed) with the separate top-level pts_prior_season field. Also corrected stale 'v3.9' string
// literals in <title> and the on-page version badge that were left over from before the v3.10 patch.
// v3.10 patch: totalRosterProj previously summed only roster.starters — i.e. whatever
// lineup the manager currently has set in Sleeper — and mislabeled that as an "optimal
// lineup score" throughout Power Rankings output. It never considered bench players or
// reassigned anyone. Verified against a fresh full-league export: the old value matched
// a true re-optimized lineup for only 2/32 teams (teams whose manager already happened to
// have their best lineup set); the other 30 were understated by up to ~46 pts because
// better bench players were sitting unused in the calculation. Root-caused and fixed here
// by actually solving the assignment problem (starters + bench pool -> roster_positions
// slots, respecting FLEX/IDP_FLEX/dual-position eligibility) via the Hungarian algorithm,
// which is the real optimal-lineup solve the "Optimal Lineup Score" label always implied.
function hungarianMinAssignment(costMatrix) {
  // Classic O(n^3) Kuhn-Munkres for a square cost matrix (minimize). 1-indexed internally
  // per the standard reference implementation; returns a 0-indexed row->col assignment array.
  const n = costMatrix.length;
  const INF = Infinity;
  const u = new Array(n + 1).fill(0);
  const v = new Array(n + 1).fill(0);
  const p = new Array(n + 1).fill(0); // p[j] = row currently assigned to col j
  const way = new Array(n + 1).fill(0);

  for (let i = 1; i <= n; i++) {
    p[0] = i;
    let j0 = 0;
    const minv = new Array(n + 1).fill(INF);
    const used = new Array(n + 1).fill(false);
    do {
      used[j0] = true;
      const i0 = p[j0];
      let delta = INF, j1 = -1;
      for (let j = 1; j <= n; j++) {
        if (!used[j]) {
          const cur = costMatrix[i0 - 1][j - 1] - u[i0] - v[j];
          if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
          if (minv[j] < delta) { delta = minv[j]; j1 = j; }
        }
      }
      for (let j = 0; j <= n; j++) {
        if (used[j]) { u[p[j]] += delta; v[j] -= delta; }
        else { minv[j] -= delta; }
      }
      j0 = j1;
    } while (p[j0] !== 0);
    do {
      const j1 = way[j0];
      p[j0] = p[j1];
      j0 = j1;
    } while (j0 !== 0);
  }

  const rowToCol = new Array(n).fill(-1);
  for (let j = 1; j <= n; j++) {
    if (p[j] !== 0) rowToCol[p[j] - 1] = j - 1;
  }
  return rowToCol;
}

function playerProjValue(pid) {
  // Same fallback rule as before (v2.6): use the real weekly projection when Sleeper
  // provides a nonzero one; otherwise approximate from prior-season total / 17 games.
  const proj = STATE.projections[pid];
  if (proj) return proj;
  const pts = STATE.playerStats[pid];
  if (pts) return pts / 17;
  return 0;
}

function playerEligiblePositions(pid) {
  const p = STATE.playerDB[pid] || {};
  if (p.fantasy_positions && p.fantasy_positions.length) return p.fantasy_positions;
  return p.position ? [p.position] : [];
}

function slotEligible(playerPositions, slot) {
  const FLEX_ELIGIBLE = { FLEX:['RB','WR','TE'], SUPER_FLEX:['QB','RB','WR','TE'], IDP_FLEX:['LB','DL','DB'], WR_RB_TE:['RB','WR','TE'], WR_RB:['RB','WR'] };
  if (FLEX_ELIGIBLE[slot]) return playerPositions.some(pos => FLEX_ELIGIBLE[slot].includes(pos));
  return playerPositions.includes(slot);
}

function totalRosterProj(roster) {
  const rosterPositions = (STATE.activeLeague.roster_positions || []).filter(s => s !== 'BN');
  if (!rosterPositions.length) return 0;

  // Full eligible pool = starters + bench (everyone except taxi/IR, which can't start).
  const starterSet = new Set((roster.starters || []).filter(pid => pid && pid !== '0'));
  const taxiSet = new Set(roster.taxi || []);
  const irSet = new Set(roster.reserve || []);
  const pool = (roster.players || []).filter(pid => !taxiSet.has(pid) && !irSet.has(pid));
  starterSet.forEach(pid => { if (!pool.includes(pid)) pool.push(pid); });

  const n = Math.max(pool.length, rosterPositions.length);
  const BIG = 1e6;
  const cost = [];
  for (let i = 0; i < n; i++) {
    const row = [];
    for (let j = 0; j < n; j++) {
      if (i < pool.length && j < rosterPositions.length) {
        const positions = playerEligiblePositions(pool[i]);
        row.push(slotEligible(positions, rosterPositions[j]) ? -playerProjValue(pool[i]) : BIG);
      } else {
        row.push(0);
      }
    }
    cost.push(row);
  }

  const assign = hungarianMinAssignment(cost);
  let total = 0;
  for (let i = 0; i < pool.length; i++) {
    const j = assign[i];
    if (j !== -1 && j < rosterPositions.length && cost[i][j] < BIG) {
      total += playerProjValue(pool[i]);
    }
  }
  return Math.round(total * 100) / 100;
}

// ══════════════════════════════════════════════
//  PRIOR SEASON PACKET (v3.4)
// ══════════════════════════════════════════════
function buildPacketPrevSeason() {
  const prev = STATE.prevSeasonData;
  const prevYear = STATE.statsSeason; // e.g. "2025"
  let t = `=== PRIOR SEASON (${prevYear}) — ${STATE.activeLeague.name} ===\n`;
  if (!prev.leagueId) {
    t += `No prior season linked (previous_league_id not found).\n`;
    t += `This may be the league's first season, or the link was not set in Sleeper.\n`;
    return t;
  }
  t += `League ID: ${prev.leagueId}\n\n`;

  // Standings
  if (prev.standings.length) {
    t += `--- FINAL STANDINGS ---\n`;
    t += `${'#'.padEnd(3)} ${'Team'.padEnd(24)} ${'Owner'.padEnd(18)} ${'W-L-T'.padEnd(8)} ${'PF'.padEnd(9)} PA\n`;
    t += '-'.repeat(75) + '\n';
    prev.standings.forEach((r, i) => {
      const rec = `${r.wins}-${r.losses}${r.ties ? '-'+r.ties : ''}`;
      const pf = (r.fpts + r.fpts_decimal/100).toFixed(2);
      const pa = (r.fpts_against + r.fpts_against_decimal/100).toFixed(2);
      t += `${String(i+1).padEnd(3)} ${r.teamName.slice(0,23).padEnd(24)} ${r.owner.slice(0,17).padEnd(18)} ${rec.padEnd(8)} ${pf.padEnd(9)} ${pa}\n`;
    });
    t += '\n';
  } else {
    t += `No standings data available.\n\n`;
  }

  // Matchup history
  const weeks = Object.keys(prev.matchups).map(Number).sort((a,b)=>a-b);
  if (weeks.length) {
    t += `--- MATCHUP HISTORY (${prevYear}) ---\n`;
    for (const week of weeks) {
      const matchups = prev.matchups[week] || [];
      if (!matchups.length) continue;
      t += `Week ${week}:\n`;
      const byId = {};
      matchups.forEach(m => {
        if (!byId[m.matchup_id]) byId[m.matchup_id] = [];
        byId[m.matchup_id].push(m);
      });
      for (const pair of Object.values(byId)) {
        if (pair.length < 2) continue;
        const [a, b] = pair;
        const ra = prev.rosters.find(r => r.roster_id === a.roster_id);
        const rb = prev.rosters.find(r => r.roster_id === b.roster_id);
        const ua = ra ? (prev.users[ra.owner_id] || {}) : {};
        const ub = rb ? (prev.users[rb.owner_id] || {}) : {};
        const na = ua.metadata?.team_name || ua.display_name || 'Team ' + a.roster_id;
        const nb = ub.metadata?.team_name || ub.display_name || 'Team ' + b.roster_id;
        const pa = (a.points || 0).toFixed(2);
        const pb = (b.points || 0).toFixed(2);
        const win = parseFloat(pa) > parseFloat(pb) ? '>' : '<';
        t += `  ${na.slice(0,22).padEnd(22)} ${pa.padStart(7)} ${win} ${pb.padStart(7)}  ${nb.slice(0,22)}\n`;
      }
    }
  } else {
    t += `No matchup history available.\n`;
  }
  return t;
}

// ══════════════════════════════════════════════
//  AGE / EXPERIENCE PROFILE (v1.2)
// ══════════════════════════════════════════════
function buildPacketAgeProfile() {
  const lg = STATE.activeLeague;
  let t = `=== AGE / EXPERIENCE PROFILE — ${lg.name} (${STATE.currentSeason}) ===\n\n`;
  t += `${'#'.padEnd(3)} ${'Team'.padEnd(24)} ${'Owner'.padEnd(18)} ${'Avg Age'.padEnd(9)} ${'Avg Exp'.padEnd(9)} ${'Youngest'.padEnd(20)} Oldest\n`;
  t += '-'.repeat(90) + '\n';

  const sorted = [...STATE.rosters].sort((a, b) => (b.settings?.wins||0) - (a.settings?.wins||0));
  sorted.forEach((r, i) => {
    const { teamName, owner } = getRosterOwner(r);
    const players = (r.players || []).map(pid => STATE.playerDB[pid]).filter(Boolean);
    const ages = players.map(p => p.age).filter(a => a != null && a > 0);
    const exps = players.map(p => p.years_exp).filter(e => e != null);
    const avgAge = ages.length ? (ages.reduce((s,v) => s+v, 0) / ages.length).toFixed(1) : '—';
    const avgExp = exps.length ? (exps.reduce((s,v) => s+v, 0) / exps.length).toFixed(1) : '—';
    const youngest = ages.length ? (() => {
      const minAge = Math.min(...ages);
      const p = players.find(pl => pl.age === minAge);
      return p ? `${(p.full_name || p.first_name || '?').slice(0,12)} (${minAge})` : '—';
    })() : '—';
    const oldest = ages.length ? (() => {
      const maxAge = Math.max(...ages);
      const p = players.find(pl => pl.age === maxAge);
      return p ? `${(p.full_name || p.first_name || '?').slice(0,12)} (${maxAge})` : '—';
    })() : '—';
    t += `${String(i+1).padEnd(3)} ${teamName.slice(0,23).padEnd(24)} ${owner.slice(0,17).padEnd(18)} ${String(avgAge).padEnd(9)} ${String(avgExp).padEnd(9)} ${youngest.padEnd(20)} ${oldest}\n`;
  });

  // League averages
  const allAges = [], allExps = [];
  STATE.rosters.forEach(r => {
    (r.players||[]).forEach(pid => {
      const p = STATE.playerDB[pid];
      if (p?.age > 0) allAges.push(p.age);
      if (p?.years_exp != null) allExps.push(p.years_exp);
    });
  });
  const leagueAvgAge = allAges.length ? (allAges.reduce((s,v)=>s+v,0)/allAges.length).toFixed(1) : '—';
  const leagueAvgExp = allExps.length ? (allExps.reduce((s,v)=>s+v,0)/allExps.length).toFixed(1) : '—';
  t += '-'.repeat(90) + '\n';
  t += `${'LEAGUE AVG'.padEnd(50)} ${String(leagueAvgAge).padEnd(9)} ${leagueAvgExp}\n`;
  return t;
}

// ══════════════════════════════════════════════
//  LEAN TEAM PACKET (totals only, v1.2)
// ══════════════════════════════════════════════
function openTeamPacketLean(rosterId) {
  const roster = STATE.rosters.find(r => r.roster_id === rosterId);
  if (!roster) return;
  const { teamName, owner } = getRosterOwner(roster);
  const s = roster.settings || {};
  const players = roster.players || [];
  const starters = new Set(roster.starters || []);
  const taxi = new Set(roster.taxi || []);
  const ir = new Set(roster.reserve || []);

  let totalPts = 0, totalProj = 0, count = 0, starterCount = 0;
  let starterPts = 0, starterProj = 0;
  const posSummary = {};

  players.forEach(pid => {
    const p = STATE.playerDB[pid] || {};
    const pos = p.position || 'UNK';
    const pts = STATE.playerStats[pid] || 0;
    const proj = STATE.projections[pid] || 0;
    totalPts += pts; totalProj += proj; count++;
    if (!posSummary[pos]) posSummary[pos] = { count: 0, pts: 0, proj: 0 };
    posSummary[pos].count++;
    posSummary[pos].pts += pts;
    posSummary[pos].proj += proj;
    if (starters.has(pid)) { starterPts += pts; starterProj += proj; starterCount++; }
  });

  const auctionEntries = Object.entries(STATE.auctionCosts)
    .filter(([pid]) => players.includes(pid))
    .sort((a,b) => b[1].cost - a[1].cost);

  let t = `=== ${teamName} | LEAN PACKET ===\n`;
  t += `Owner: ${owner} | League: ${STATE.activeLeague.name} | Season: ${STATE.currentSeason}\n`;
  t += `Record: ${s.wins||0}-${s.losses||0} | PF: ${fmtPts(s.fpts, s.fpts_decimal)}\n\n`;
  t += `--- TOTALS ---\n`;
  t += `Roster size:   ${count} players (${starterCount} starters)\n`;
  t += `Total Pts(${STATE.statsSeason}): ${totalPts.toFixed(1)}\n`;
  t += `Starter Pts:   ${starterPts.toFixed(1)}\n`;
  t += `Total Proj(Wk${STATE.currentWeek}): ${totalProj.toFixed(1)}\n`;
  t += `Starter Proj:  ${starterProj.toFixed(1)}\n\n`;
  t += `--- BY POSITION ---\n`;
  const posOrder = ['QB','RB','WR','TE','K','DEF','DL','LB','DB','IDP_FLEX'];
  const sortedPos = Object.keys(posSummary).sort((a,b) => {
    const ai = posOrder.indexOf(a), bi = posOrder.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });
  sortedPos.forEach(pos => {
    const d = posSummary[pos];
    t += `  ${pos.padEnd(8)} ${String(d.count).padEnd(3)} players | Pts: ${d.pts.toFixed(1).padEnd(8)} | Proj: ${d.proj.toFixed(1)}\n`;
  });
  if (auctionEntries.length) {
    t += `\n--- AUCTION COSTS ---\n`;
    auctionEntries.slice(0, 20).forEach(([pid, data]) => {
      const p = STATE.playerDB[pid] || {};
      const name = (p.full_name || pid).slice(0, 24);
      t += `  $${String(data.cost).padEnd(6)} ${name}\n`;
    });
  }
  openModal(`${teamName} — Lean Packet`, t);
}

// ══════════════════════════════════════════════
//  JSON DOWNLOAD
// ══════════════════════════════════════════════
document.getElementById('btn-json-download').onclick = () => {
  // Build star player sets for JSON tagging
  // Star = top 24 overall by prior season pts OR top 3 at position
  const allPtsArr = Object.entries(STATE.playerStats).map(([pid, pts]) => ({ pid, pts })).sort((a,b) => b.pts - a.pts);
  const top24Overall = new Set(allPtsArr.slice(0, 24).map(x => x.pid));
  const byPos = {};
  for (const [pid, pts] of Object.entries(STATE.playerStats)) {
    const pos = STATE.playerDB[pid]?.position || 'UNK';
    if (!byPos[pos]) byPos[pos] = [];
    byPos[pos].push({ pid, pts });
  }
  const top3ByPos = new Set();
  for (const arr of Object.values(byPos)) {
    arr.sort((a,b) => b.pts - a.pts).slice(0,3).forEach(x => top3ByPos.add(x.pid));
  }

  // Build enriched rosters with player names resolved
  const enrichedRosters = STATE.rosters.map(r => {
    const { teamName, owner, orphan } = getRosterOwner(r);
    const resolvePlayers = (pids) => (pids || []).map(pid => {
      const p = STATE.playerDB[pid] || {};
      const isStar = top24Overall.has(pid) || top3ByPos.has(pid);
      const isUnsigned = !p.team; // no NFL team = unsigned/FA
      const age = p.age || null;
      const exp = p.years_exp !== undefined ? p.years_exp : null;
      // dynasty_caution: flag players likely past prime or injury-risk age by position
      const POS_AGE_WARN = { QB:36, RB:29, WR:31, TE:32, DL:32, LB:31, DB:33 };
      const ageThresh = POS_AGE_WARN[p.position] || 33;
      const dynastyCaution = age && age >= ageThresh ? `age_${age}` : (exp !== null && exp >= 10 ? `exp_${exp}yr` : undefined);
      // taxi_eligible: Sleeper taxi = years_exp 0 or 1 (rookie or 2nd year), no hard rule but common standard
      const taxiEligible = exp !== null && exp <= 1 ? true : undefined;
      const splits = STATE.playerStatSplits[pid] || undefined;
      const durability = buildDurabilityProfile(pid, p.position);
      return {
        player_id: pid,
        name: p.full_name || (p.first_name ? `${p.first_name} ${p.last_name}` : pid),
        position: p.position || '?',
        nfl_team: p.team || '—',
        age,
        years_exp: exp,
        pts_prior_season: STATE.playerStats[pid] !== undefined ? STATE.playerStats[pid] : null,
        stat_splits: splits,
        proj_current_week: STATE.projections[pid] !== undefined ? STATE.projections[pid] : null,
        // v5.0: full 2026 season projection total (not yet used for ranking/value — see season_projection_coverage in summary)
        proj_season: STATE.seasonProjections[pid] !== undefined ? STATE.seasonProjections[pid] : null,
        proj_season_is_placeholder: STATE.seasonProjections[pid] === 0,
        star: isStar || undefined,
        fa_unsigned: isUnsigned || undefined,
        dynasty_caution: dynastyCaution,
        taxi_eligible: taxiEligible,
        games_played_history: durability.games_played_history,
        pts_history: durability.pts_history,
        durability_flag: durability.durability_flag,
        season_stat_history: durability.season_stat_history,
        injury_status_current: p.injury_status || null,
        injury_freshness: buildInjuryFreshness(pid), // v2.8
        weekly_trend: buildWeeklyTrend(pid), // v2.8
        draft_capital: STATE.draftedPicks[pid] || null,
        fantasy_positions: p.fantasy_positions || null, // v3.9: rostered players were missing multi-position
        // eligibility (e.g. DL/LB dual-eligible edge rushers) — free agents already had this (v3.1).
        // Fixes DL/LB (and other) dual-eligibility being silently dropped for any rostered player.
        // v4.2: auction_cost/is_keeper were captured in STATE.auctionCosts but never surfaced on
        // rostered players — the field keeper leagues actually need (was this player kept this
        // offseason, and what did/will he cost?). is_keeper is true/false/null: null means Sleeper
        // didn't report a keeper flag for this player (e.g. never appeared in a draft-picks payload),
        // NOT "confirmed not a keeper" — only an explicit false means that.
        auction_cost: STATE.auctionCosts[pid]?.cost ?? null,
        is_keeper: STATE.auctionCosts[pid]?.is_keeper ?? null,
      };
    });

    // Roster size violation check (v3.8 fix)
    // Sleeper confirms taxi and IR/reserve players do NOT count against a team's
    // roster limit (source: support.sleeper.com "How do I set positional limits?").
    // roster_positions.length is ONLY the starters+bench cap; taxi_slots and
    // reserve_slots are separate league settings layered on top of it. The old
    // check compared r.players.length (which includes taxi+reserve players)
    // directly against roster_positions.length, so any team using taxi/IR, or
    // any team with unfilled bench slots, was mislabeled as a "violation."
    const rosterPositions = STATE.activeLeague.roster_positions || [];
    const benchSlotTotal = rosterPositions.filter(p => p === 'BN').length;
    const taxiSlots = STATE.activeLeague.settings?.taxi_slots || 0;
    const reserveSlots = STATE.activeLeague.settings?.reserve_slots || 0;
    const rosterCapacity = rosterPositions.length ? (rosterPositions.length + taxiSlots + reserveSlots) : null;
    const actualCount = (r.players || []).length;
    // A real violation is only when a team exceeds its total legal capacity
    // (starters + bench + taxi + reserve). Unfilled bench slots are normal and
    // are reported separately via bench_slots_open, not flagged as a violation.
    const rosterSizeViolation = rosterCapacity && actualCount > rosterCapacity
      ? { expected_max: rosterCapacity, actual: actualCount, breakdown: { roster_positions: rosterPositions.length, taxi_slots: taxiSlots, reserve_slots: reserveSlots } }
      : undefined;

    // Compute bench = all players minus starters, taxi, and IR
    const starterSet = new Set((r.starters || []).filter(pid => pid && pid !== '0'));
    const taxiSet = new Set(r.taxi || []);
    const irSet = new Set(r.reserve || []);
    const benchPids = (r.players || []).filter(pid =>
      !starterSet.has(pid) && !taxiSet.has(pid) && !irSet.has(pid)
    );
    const benchSlotsOpen = benchSlotTotal ? { filled: benchPids.length, total: benchSlotTotal } : undefined;

    return {
      roster_id: r.roster_id,
      team_name: teamName,
      owner_display: owner,
      orphan: orphan || false,
      roster_size_violation: rosterSizeViolation,
      bench_slots_open: benchSlotsOpen,
      settings: r.settings,
      starters: resolvePlayers(Array.from(starterSet)),
      bench: resolvePlayers(benchPids),
      taxi: resolvePlayers(r.taxi),
      reserve: resolvePlayers(r.reserve),
    };
  });

  // v2.5: standings + power_rankings — same computation as the light export, added here so
  // Power Rankings work doesn't require recomputing rank/sort from raw roster.settings by hand.
  const sortedRostersFull = [...STATE.rosters].sort((a, b) => {
    const aw = a.settings?.wins || 0, bw = b.settings?.wins || 0;
    if (bw !== aw) return bw - aw;
    return (b.settings?.fpts || 0) - (a.settings?.fpts || 0);
  });
  const standingsFull = sortedRostersFull.map((r, i) => {
    const { teamName, owner } = getRosterOwner(r);
    const s = r.settings || {};
    return {
      rank: i + 1,
      roster_id: r.roster_id,
      team_name: teamName,
      owner: owner,
      record: `${s.wins||0}-${s.losses||0}${s.ties?'-'+s.ties:''}`,
      pf: parseFloat(fmtPts(s.fpts, s.fpts_decimal)) || 0,
      pa: parseFloat(fmtPts(s.fpts_against, s.fpts_against_decimal)) || 0,
    };
  });
  const powerRankingsFull = [...STATE.rosters].sort((a, b) => totalRosterProj(b) - totalRosterProj(a)).map((r, i) => {
    const { teamName } = getRosterOwner(r);
    return {
      power_rank: i + 1,
      team_name: teamName,
      starter_proj: totalRosterProj(r),
      pf: parseFloat(fmtPts(r.settings?.fpts, r.settings?.fpts_decimal)) || 0,
    };
  });

  const snapshot = {
    exported_at: new Date().toISOString(),
    tool_version: '5.0',
    standings: standingsFull,
    power_rankings: powerRankingsFull,
    // ── SUMMARY HEADER (v1.2) ──────────────────────────────────
    summary: {
      league_name: STATE.activeLeague.name,
      league_id: STATE.activeLeague.league_id,
      season: STATE.currentSeason,
      stats_season: STATE.statsSeason,
      current_week: STATE.currentWeek,
      scoring_label: getScoringLabel(STATE.activeLeague),
      format: STATE.activeLeague.settings?.type === 2 ? 'Dynasty' : STATE.activeLeague.settings?.type === 1 ? 'Keeper' : 'Redraft',
      total_rosters: STATE.activeLeague.total_rosters,
      commissioner: STATE.username,
      roster_positions: STATE.activeLeague.roster_positions || [],
      has_idp: (STATE.activeLeague.roster_positions || []).some(p => ['DL','LB','DB','IDP_FLEX'].includes(p)),
      waiver_type: STATE.activeLeague.settings?.waiver_type === 2 ? 'FAAB' : STATE.activeLeague.settings?.waiver_type === 0 ? 'Rolling' : 'Standard',
      playoff_week_start: STATE.activeLeague.settings?.playoff_week_start || null,
      playoff_teams: STATE.activeLeague.settings?.playoff_teams || null,
      top_team_by_pf: (() => {
        const top = [...STATE.rosters].sort((a,b) => (b.settings?.fpts||0)-(a.settings?.fpts||0))[0];
        return top ? getRosterOwner(top).teamName : '—';
      })(),
      total_players_rostered: STATE.rosters.reduce((s,r) => s + (r.players||[]).length, 0),
      auction_costs_loaded: Object.keys(STATE.auctionCosts).length,
      // v4.2: count of players where Sleeper explicitly reported is_keeper (true or false) —
      // NOT total rostered players. If this is 0, is_keeper will be null for everyone in this
      // export and no keeper-vs-fresh-pick distinction can be drawn from the data.
      keepers_flagged_count: Object.values(STATE.auctionCosts).filter(v => v.is_keeper === true || v.is_keeper === false).length,
      free_agents_embedded: (() => {
        const rostered = new Set();
        STATE.rosters.forEach(r => (r.players || []).forEach(pid => rostered.add(pid)));
        return Object.entries(STATE.playerDB).filter(([pid, p]) =>
          !rostered.has(pid) && (p.team || STATE.playerStats[pid] || STATE.projections[pid])
        ).length;
      })(),
      // v5.0: not yet used to drive ranking/value logic — informational only, so the
      // 2025-history → 2026-projection switch-over can be judged from real coverage data.
      season_projection_coverage: buildProjectionCoverage(),
    },
    // ───────────────────────────────────────────────────────────
    commissioner: STATE.username,
    league: STATE.activeLeague,
    season: STATE.currentSeason,
    stats_season: STATE.statsSeason,
    current_week: STATE.currentWeek,
    scoring_label: getScoringLabel(STATE.activeLeague),
    users: STATE.leagueUsers,
    rosters: enrichedRosters,
    matchups: STATE.matchupsByWeek,
    transactions: STATE.transactions,
    trade_log: buildTradeLog(),
    traded_picks: STATE.tradedPicks,
    projections_week: STATE.currentWeek,
    prior_season_stats: STATE.playerStats,
    projections: STATE.projections,
    scoring_map: STATE.scoringMap,
    auction_costs: STATE.auctionCosts,
    faab_efficiency: buildFaabEfficiency(), // v2.8
    positional_availability: (() => {
      const rostered = new Set();
      STATE.rosters.forEach(r => (r.players || []).forEach(pid => rostered.add(pid)));
      const summary = {};
      for (const [pid, player] of Object.entries(STATE.playerDB)) {
        if (rostered.has(pid)) continue;
        if (!player.team && !STATE.playerStats[pid] && !STATE.projections[pid] && player.status !== 'Active') continue; // v4.3: don't drop active players missing team/stats/proj (e.g. Saquon Barkley export gap)
        const pos = player.position || 'UNK';
        if (!summary[pos]) summary[pos] = { count: 0, top_pts: null, top_name: null };
        summary[pos].count++;
        const pts = STATE.playerStats[pid] || 0;
        if (pts > 0 && (summary[pos].top_pts === null || pts > summary[pos].top_pts)) {
          summary[pos].top_pts = pts;
          summary[pos].top_name = player.full_name || (player.first_name ? `${player.first_name} ${player.last_name}` : pid);
        }
      }
      return summary;
    })(),
    player_stat_splits: STATE.playerStatSplits,
    free_agents: (() => {
      // v2.2: per-position cap using roster_positions + total_teams so it scales correctly
      const rp = STATE.activeLeague.roster_positions || [];
      const teams = STATE.rosters.length || 10;
      const FLEX_ELIGIBLE = { FLEX:['RB','WR','TE'], SUPER_FLEX:['QB','RB','WR','TE'], IDP_FLEX:['LB','DL','DB'], WR_RB_TE:['RB','WR','TE'], WR_RB:['RB','WR'] };
      const FA_CAP_MULT = 3.5;
      const posCap = {};
      for (const slot of rp) {
        if (FLEX_ELIGIBLE[slot]) {
          const eligible = FLEX_ELIGIBLE[slot];
          const share = 1 / eligible.length;
          for (const ep of eligible) posCap[ep] = (posCap[ep] || 0) + share;
        } else if (['QB','RB','WR','TE','K','DEF','LB','DL','DB','DE','DT','CB'].includes(slot)) {
          posCap[slot] = (posCap[slot] || 0) + 1;
        }
      }
      // merge DE/DT->DL, CB->DB for cap purposes
      if (posCap.DE || posCap.DT) { posCap.DL = (posCap.DL || 0) + (posCap.DE || 0) + (posCap.DT || 0); delete posCap.DE; delete posCap.DT; }
      if (posCap.CB) { posCap.DB = (posCap.DB || 0) + posCap.CB; delete posCap.CB; }
      const getPosCap = pos => {
        const pk = pos === 'DE' || pos === 'DT' ? 'DL' : pos === 'CB' ? 'DB' : pos;
        return Math.ceil((posCap[pk] || 1) * teams * FA_CAP_MULT);
      };
      const rostered = new Set();
      STATE.rosters.forEach(r => (r.players || []).forEach(pid => rostered.add(pid)));
      const fasAll = [];
      for (const [pid, player] of Object.entries(STATE.playerDB)) {
        if (rostered.has(pid)) continue;
        if (!player.team && !STATE.playerStats[pid] && !STATE.projections[pid] && player.status !== 'Active') continue; // v4.3: don't drop active players missing team/stats/proj (e.g. Saquon Barkley export gap)
        const durability = buildDurabilityProfile(pid, player.position);
        fasAll.push({
          player_id: pid,
          name: player.full_name || (player.first_name ? `${player.first_name} ${player.last_name}` : pid),
          position: player.position || '?',
          nfl_team: player.team || '—',
          age: player.age || null,
          years_exp: player.years_exp !== undefined ? player.years_exp : null,
          pts_prior_season: STATE.playerStats[pid] !== undefined ? STATE.playerStats[pid] : null,
          proj_current_week: STATE.projections[pid] !== undefined ? STATE.projections[pid] : null,
          // v3.6.1: Sleeper returns a literal 0 (not null/undefined) when it has no real
          // projection for a player — standard behavior for IDP/K and common for many FAs
          // generally. A bare 0 could be misread as "projected to score zero points" rather
          // than "no projection data available." This flag disambiguates that without
          // altering the underlying value (never fabricate a number).
          proj_current_week_is_placeholder: STATE.projections[pid] === 0,
          // v5.0: full 2026 season projection total (not yet used for ranking/value — see season_projection_coverage in summary)
          proj_season: STATE.seasonProjections[pid] !== undefined ? STATE.seasonProjections[pid] : null,
          proj_season_is_placeholder: STATE.seasonProjections[pid] === 0,
          injury_status: player.injury_status || null,
          active_status: player.status || null,
          games_played_history: durability.games_played_history,
          pts_history: durability.pts_history,
          durability_flag: durability.durability_flag,
          season_stat_history: durability.season_stat_history,
          injury_status_current: player.injury_status || null,
          injury_freshness: buildInjuryFreshness(pid), // v2.8
          weekly_trend: buildWeeklyTrend(pid), // v2.8
          draft_capital: STATE.draftedPicks[pid] || null,
        });
      }
      fasAll.sort((a, b) => {
        const ap = a.pts_prior_season || 0, bp = b.pts_prior_season || 0;
        if (bp !== ap) return bp - ap;
        return (b.proj_current_week || 0) - (a.proj_current_week || 0);
      });
      // Apply per-position cap after sorting by pts desc
      const posCounts = {};
      return fasAll.filter(fa => {
        const pk = fa.position === 'DE' || fa.position === 'DT' ? 'DL' : fa.position === 'CB' ? 'DB' : fa.position;
        posCounts[pk] = (posCounts[pk] || 0) + 1;
        return posCounts[pk] <= getPosCap(fa.position);
      });
    })(),
    prev_season: STATE.prevSeasonData.leagueId ? {
      league_id: STATE.prevSeasonData.leagueId,
      season: STATE.statsSeason,
      standings: STATE.prevSeasonData.standings,
      matchup_weeks_loaded: Object.keys(STATE.prevSeasonData.matchups).length,
    } : null,
  };
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${STATE.activeLeague?.name?.replace(/\s+/g,'_') || 'league'}_snapshot_${STATE.currentSeason}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
