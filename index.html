async function downloadDraftSnapshot() {
  const lg = STATE.activeLeague;
  const draft = STATE.draftInfo;
  if (!draft?.draft_id) throw new Error('No draft found for this league.');

  // Fetch live draft detail and all picks made so far
  const [draftDetail, picksRaw] = await Promise.all([
    sleeperGet(`/draft/${draft.draft_id}`),
    sleeperGet(`/draft/${draft.draft_id}/picks`),
  ]);

  const picks = Array.isArray(picksRaw) ? picksRaw : [];
  const totalRosters = lg.total_rosters || STATE.rosters.length;
  const totalRounds = draftDetail?.settings?.rounds || draft?.settings?.rounds || 3;
  const draftOrder = draftDetail?.draft_order || {}; // user_id -> slot
  const slotToRoster = draftDetail?.slot_to_roster_id || {}; // slot -> roster_id

  // Build roster_id -> display info map
  const rosterMap = {};
  STATE.rosters.forEach(r => {
    const { teamName, owner } = getRosterOwner(r);
    rosterMap[r.roster_id] = { teamName, owner, roster_id: r.roster_id };
  });

  // Build slot -> roster_id map (prefer API slotToRoster, fall back to waiver position)
  const slotMap = {}; // slot (1-based) -> roster_id
  if (Object.keys(slotToRoster).length) {
    for (const [slot, rid] of Object.entries(slotToRoster)) {
      slotMap[parseInt(slot)] = parseInt(rid);
    }
  } else {
    // Fall back: waiver_position ascending = draft slot ascending
    const sorted = [...STATE.rosters].sort((a, b) =>
      (a.settings?.waiver_position || 99) - (b.settings?.waiver_position || 99)
    );
    sorted.forEach((r, i) => { slotMap[i + 1] = r.roster_id; });
  }

  // Traded pick ownership map: key = `${roster_id}_${season}_${round}` -> owner roster_id
  const tradedOwner = {};
  (STATE.tradedPicks || []).forEach(tp => {
    if (String(tp.season) === String(STATE.currentSeason)) {
      const key = `${tp.roster_id}_${tp.season}_${tp.round}`;
      tradedOwner[key] = tp.owner_id;
    }
  });

  // Resolve who owns a given pick slot in a given round (snake draft)
  function resolvePickOwner(round, slot) {
    // Snake: odd rounds go slot 1→N, even rounds go N→1
    const isEven = round % 2 === 0;
    const snakeSlot = isEven ? (totalRosters - slot + 1) : slot;
    const originalRosterId = slotMap[snakeSlot];
    if (!originalRosterId) return { roster_id: null, teamName: `Slot ${snakeSlot}`, owner: '—', original_roster_id: null };
    const tradeKey = `${originalRosterId}_${STATE.currentSeason}_${round}`;
    const ownerRosterId = tradedOwner[tradeKey] ?? originalRosterId;
    const info = rosterMap[ownerRosterId] || { teamName: 'Team ' + ownerRosterId, owner: '—', roster_id: ownerRosterId };
    return {
      roster_id: ownerRosterId,
      teamName: info.teamName,
      owner: info.owner,
      original_roster_id: originalRosterId,
      original_team: rosterMap[originalRosterId]?.teamName || 'Team ' + originalRosterId,
    };
  }

  // Resolve pick number -> round + slot within round
  function pickNoToRoundSlot(pickNo) {
    const round = Math.ceil(pickNo / totalRosters);
    const slot = pickNo - (round - 1) * totalRosters;
    return { round, slot };
  }

  // Build picks made array with full player + owner info
  const picksMade = picks.map(pk => {
    const pid = pk.player_id ? String(pk.player_id) : null;
    const p = pid ? (STATE.playerDB[pid] || {}) : {};
    const name = p.full_name || (p.first_name && p.last_name ? `${p.first_name} ${p.last_name}` : pid || '—');
    const { round, slot } = pickNoToRoundSlot(pk.pick_no || 0);
    const ownerInfo = rosterMap[pk.roster_id] || { teamName: 'Team ' + pk.roster_id, owner: '—' };
    const durability = pid ? buildDurabilityProfile(pid, p.position) : null;
    return {
      pick_no: pk.pick_no,
      round,
      slot_in_round: slot,
      pick_label: `${round}.${String(slot).padStart(2,'0')}`,
      player_id: pid,
      player_name: name,
      position: p.position || '—',
      nfl_team: p.team || '—',
      age: p.age || null,
      years_exp: p.years_exp !== undefined ? p.years_exp : null,
      pts_prior_season: STATE.playerStats[pid] !== undefined ? STATE.playerStats[pid] : null,
      stat_splits: pid ? (STATE.playerStatSplits[pid] || null) : null,
      proj_current_week: STATE.projections[pid] !== undefined ? STATE.projections[pid] : null,
      // v5.0: full 2026 season projection total, informational only
      proj_season: pid && STATE.seasonProjections[pid] !== undefined ? STATE.seasonProjections[pid] : null,
      auction_cost: pid ? (STATE.auctionCosts[pid]?.cost ?? null) : null,
      is_keeper: pk.is_keeper === true ? true : (pk.is_keeper === false ? false : null), // v4.2 — straight from Sleeper's pick object, this pick's actual keeper flag
      drafted_by_roster_id: pk.roster_id,
      drafted_by_team: ownerInfo.teamName,
      drafted_by_owner: ownerInfo.owner,
      season_stat_history: durability ? durability.season_stat_history : null,
      metadata: pk.metadata || {},
      is_rookie: p.years_exp === 0, // v2.7
      player_value: pid ? getPlayerValue(pid) : null, // v2.7
      pick_value: pickEstimatedValue({ round, slot, totalRosters, totalRounds, season: STATE.currentSeason, currentSeason: STATE.currentSeason }), // v2.7, dynamic decay v3.7
      pick_value_player_scale: scaledPickValue({ round, slot, totalRosters, totalRounds, season: STATE.currentSeason, currentSeason: STATE.currentSeason }), // v3.1, dynamic decay v3.7
      fantasy_positions: p.fantasy_positions || null, // v3.1: native Sleeper multi-position eligibility
    };
  });

  // Total picks in draft
  const totalPicks = totalRosters * totalRounds;
  const picksMadeCount = picks.length;
  const currentPickNo = picksMadeCount + 1;

  // Build remaining picks array
  const remainingPicks = [];
  for (let pickNo = currentPickNo; pickNo <= totalPicks; pickNo++) {
    const { round, slot } = pickNoToRoundSlot(pickNo);
    const ownerInfo = resolvePickOwner(round, slot);
    remainingPicks.push({
      pick_no: pickNo,
      round,
      slot_in_round: slot,
      pick_label: `${round}.${String(slot).padStart(2,'0')}`,
      on_clock: pickNo === currentPickNo,
      roster_id: ownerInfo.roster_id,
      team_name: ownerInfo.teamName,
      owner: ownerInfo.owner,
      original_roster_id: ownerInfo.original_roster_id,
      original_team: ownerInfo.original_team,
      is_traded_pick: ownerInfo.roster_id !== ownerInfo.original_roster_id,
      pick_value: pickEstimatedValue({ round, slot, totalRosters, totalRounds, season: STATE.currentSeason, currentSeason: STATE.currentSeason }), // v2.7, dynamic decay v3.7
      pick_value_player_scale: scaledPickValue({ round, slot, totalRosters, totalRounds, season: STATE.currentSeason, currentSeason: STATE.currentSeason }), // v3.1, dynamic decay v3.7
    });
  }

  // My picks remaining
  const myUser = Object.values(STATE.leagueUsers).find(u =>
    u.display_name?.toLowerCase() === STATE.username?.toLowerCase()
  );
  const myRoster = myUser ? STATE.rosters.find(r => r.owner_id === myUser.user_id) : null;
  const myRemainingPicks = remainingPicks.filter(p => p.roster_id === myRoster?.roster_id);

  const draftSnapshot = {
    exported_at: new Date().toISOString(),
    tool_version: '5.0',
    export_type: 'DRAFT_LIVE',
    league_name: lg.name,
    league_id: lg.league_id,
    season: STATE.currentSeason,
    draft_id: draft.draft_id,
    draft_type: draftDetail?.type || draft?.type || '—',
    draft_status: draftDetail?.status || draft?.status || '—',
    total_rounds: totalRounds,
    total_teams: totalRosters,
    total_picks: totalPicks,
    picks_made: picksMadeCount,
    picks_remaining: totalPicks - picksMadeCount,
    current_pick_no: currentPickNo <= totalPicks ? currentPickNo : null,
    current_pick_label: currentPickNo <= totalPicks ? (() => { const {round,slot} = pickNoToRoundSlot(currentPickNo); return `${round}.${String(slot).padStart(2,'0')}`; })() : 'Draft Complete',
    on_the_clock: currentPickNo <= totalPicks ? (() => { const {round,slot} = pickNoToRoundSlot(currentPickNo); return resolvePickOwner(round, slot); })() : null,
    scoring_label: getScoringLabel(STATE.activeLeague),
    scoring_map: STATE.scoringMap,
    // v5.0: same coverage metric as the Full export — previously missing from DRAFT_LIVE
    season_projection_coverage: buildProjectionCoverage(),
    roster_positions: STATE.activeLeague.roster_positions || [],
    my_remaining_picks: myRemainingPicks,
    picks_made_log: picksMade,
    remaining_picks: remainingPicks,
    traded_picks_this_season: (STATE.tradedPicks || []).filter(tp => String(tp.season) === String(STATE.currentSeason)),
    positional_availability: (() => {
      // Exclude both pre-draft rostered players AND players already taken in this live draft
      const taken = new Set();
      STATE.rosters.forEach(r => (r.players || []).forEach(pid => taken.add(pid)));
      picks.forEach(pk => { if (pk.player_id) taken.add(String(pk.player_id)); });
      const summary = {};
      for (const [pid, player] of Object.entries(STATE.playerDB)) {
        if (taken.has(pid)) continue;
        if (!player.team && !STATE.playerStats[pid] && !STATE.projections[pid] && player.status !== 'Active') continue; // v4.3: don't drop active players missing team/stats/proj (e.g. Saquon Barkley export gap)
        const pos = player.position || 'UNK';
        if (!summary[pos]) summary[pos] = { count: 0, top_pts: null, top_name: null };
        summary[pos].count++;
        const pts = STATE.playerStats[pid] || 0;
        if (pts > 0 && (summary[pos].top_pts === null || pts > summary[pos].top_pts)) {
          summary[pos].top_pts = pts;
          summary[pos].top_name = player.full_name || (player.first_name ? `${player.first_name} ${player.last_name}` : pid);
        }
      }
      return summary;
    })(),
    free_agents: (() => {
      // All undrafted players: exclude pre-draft rostered AND live draft picks
      const taken = new Set();
      STATE.rosters.forEach(r => (r.players || []).forEach(pid => taken.add(pid)));
      picks.forEach(pk => { if (pk.player_id) taken.add(String(pk.player_id)); });
      // v2.2: per-position cap (same formula as main export)
      const rp = STATE.activeLeague.roster_positions || [];
      const FLEX_ELIGIBLE = { FLEX:['RB','WR','TE'], SUPER_FLEX:['QB','RB','WR','TE'], IDP_FLEX:['LB','DL','DB'], WR_RB_TE:['RB','WR','TE'], WR_RB:['RB','WR'] };
      const FA_CAP_MULT = 3.5;
      const posCap = {};
      for (const slot of rp) {
        if (FLEX_ELIGIBLE[slot]) {
          const eligible = FLEX_ELIGIBLE[slot];
          const share = 1 / eligible.length;
          for (const ep of eligible) posCap[ep] = (posCap[ep] || 0) + share;
        } else if (['QB','RB','WR','TE','K','DEF','LB','DL','DB','DE','DT','CB'].includes(slot)) {
          posCap[slot] = (posCap[slot] || 0) + 1;
        }
      }
      if (posCap.DE || posCap.DT) { posCap.DL = (posCap.DL || 0) + (posCap.DE || 0) + (posCap.DT || 0); delete posCap.DE; delete posCap.DT; }
      if (posCap.CB) { posCap.DB = (posCap.DB || 0) + posCap.CB; delete posCap.CB; }
      const getPosCap = pos => {
        const pk = pos === 'DE' || pos === 'DT' ? 'DL' : pos === 'CB' ? 'DB' : pos;
        return Math.ceil((posCap[pk] || 1) * totalRosters * FA_CAP_MULT);
      };
      const fasAll = [];
      for (const [pid, player] of Object.entries(STATE.playerDB)) {
        if (taken.has(pid)) continue;
        if (!player.team && !STATE.playerStats[pid] && !STATE.projections[pid] && player.status !== 'Active') continue; // v4.3: don't drop active players missing team/stats/proj (e.g. Saquon Barkley export gap)
        const age = player.age || null;
        const exp = player.years_exp !== undefined ? player.years_exp : null;
        const POS_AGE_WARN = { QB:36, RB:29, WR:31, TE:32, DL:32, LB:31, DB:33 };
        const ageThresh = POS_AGE_WARN[player.position] || 33;
        const dynastyCaution = age && age >= ageThresh ? `age_${age}` : (exp !== null && exp >= 10 ? `exp_${exp}yr` : undefined);
        const taxiEligible = exp !== null && exp <= 1 ? true : undefined;
        const durability = buildDurabilityProfile(pid, player.position);
        fasAll.push({
          player_id: pid,
          name: player.full_name || (player.first_name ? `${player.first_name} ${player.last_name}` : pid),
          position: player.position || '?',
          nfl_team: player.team || '—',
          age,
          years_exp: exp,
          pts_prior_season: STATE.playerStats[pid] !== undefined ? STATE.playerStats[pid] : null,
          stat_splits: STATE.playerStatSplits[pid] || null,
          proj_current_week: STATE.projections[pid] !== undefined ? STATE.projections[pid] : null,
          // v3.6.1: Sleeper returns a literal 0 (not null/undefined) when it has no real
          // projection for a player — standard behavior for IDP/K and common for many FAs
          // generally. A bare 0 could be misread as "projected to score zero points" rather
          // than "no projection data available." This flag disambiguates that without
          // altering the underlying value (never fabricate a number).
          proj_current_week_is_placeholder: STATE.projections[pid] === 0,
          // v5.0: full 2026 season projection total (not yet used for player_value/ranking — informational)
          proj_season: STATE.seasonProjections[pid] !== undefined ? STATE.seasonProjections[pid] : null,
          proj_season_is_placeholder: STATE.seasonProjections[pid] === 0,
          dynasty_caution: dynastyCaution,
          taxi_eligible: taxiEligible,
          injury_status: player.injury_status || null,
          active_status: player.status || null,
          games_played_history: durability.games_played_history,
          pts_history: durability.pts_history,
          durability_flag: durability.durability_flag,
          season_stat_history: durability.season_stat_history,
          injury_status_current: player.injury_status || null,
          injury_freshness: buildInjuryFreshness(pid), // v2.8
          weekly_trend: buildWeeklyTrend(pid), // v2.8
          draft_capital: STATE.draftedPicks[pid] || null,
          fantasy_positions: player.fantasy_positions || null, // v3.1
          // v3.6: player_value now computed for free agents using the same
          // getPlayerValueDetail() path as picks_made_log — includes the
          // return-yardage layer (v3.5) and IDP/K fallback (v3.2). Previously
          // missing from FA objects, limiting in-season waiver analysis.
          player_value: getPlayerValue(pid),
          player_value_basis: (() => { const d = getPlayerValueDetail(pid); return d ? d.basis : null; })(),
        });
      }
      fasAll.sort((a, b) => {
        const ap = a.pts_prior_season || 0, bp = b.pts_prior_season || 0;
        if (bp !== ap) return bp - ap;
        return (b.proj_current_week || 0) - (a.proj_current_week || 0);
      });
      const posCounts = {};
      return fasAll.filter(fa => {
        const pk = fa.position === 'DE' || fa.position === 'DT' ? 'DL' : fa.position === 'CB' ? 'DB' : fa.position;
        posCounts[pk] = (posCounts[pk] || 0) + 1;
        return posCounts[pk] <= getPosCap(fa.position);
      });
    })(),
    draft_order_slots: Object.entries(slotMap).sort((a,b) => a[0]-b[0]).map(([slot, rid]) => ({
      slot: parseInt(slot),
      roster_id: rid,
      team_name: rosterMap[rid]?.teamName || 'Team ' + rid,
      owner: rosterMap[rid]?.owner || '—',
    })),
    // v2.7: rookie class layer — built from playerDB (years_exp===0), filtered to
    // skill/IDP positions with a value attached. No scouting-grade data source is
    // wired in yet; this is roster-DB-only (age/team/proj), flagged per data rule.
    rookie_class: Object.values(buildRookieClass()).sort((a, b) => (b.player_value || 0) - (a.player_value || 0)),
    // v2.7: keeper/draft-value calculator for picks already made this draft —
    // compares player_value vs the pick's estimated cost (pick_value).
    keeper_value_summary: picksMade
      .filter(pk => pk.player_id)
      .map(pk => buildKeeperValueRow(pk.player_id, { round: pk.round, slot: pk.slot_in_round, totalRounds }, totalRosters, STATE.currentSeason)),
  };

  const blob = new Blob([JSON.stringify(draftSnapshot, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${lg.name?.replace(/\s+/g,'_') || 'league'}_DRAFT_${STATE.currentSeason}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('btn-change-league').onclick = () => {
  // Reset to league picker
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('stats-strip').style.display = 'none';
  document.getElementById('global-packets').style.display = 'none';
  document.getElementById('teams-section').style.display = 'none';
  document.getElementById('league-screen').style.display = 'block';
  STATE.activeLeague = null;
};

document.getElementById('btn-logout').onclick = () => {
  STATE = { username:'', userId:'', leagues:[], activeLeague:null, leagueUsers:{}, rosters:[], matchupsByWeek:{}, transactions:[], tradedPicks:[], draftedPicks:{}, draftInfo:null, playerDB:{}, projections:{}, playerStats:{}, playerStatSplits:{}, statsHistory:{}, scoringMap:{}, currentWeek:1, currentSeason:'', statsSeason:'', auctionCosts:{}, condensedStats:false, weeklyPts:{}, prevSeasonData:{ standings:[], matchups:{}, leagueId:null, rosters:[], users:{} } };
  document.getElementById('league-screen').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('stats-strip').style.display = 'none';
  document.getElementById('global-packets').style.display = 'none';
  document.getElementById('teams-section').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('commissioner-badge').style.display = 'none';
  document.getElementById('btn-logout').style.display = 'none';
  document.getElementById('username-input').value = '';
  document.getElementById('login-error').textContent = '';
};

//  UTILITIES
// ══════════════════════════════════════════════
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// PWA: register service worker for home-screen install / offline app-shell caching
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
}
