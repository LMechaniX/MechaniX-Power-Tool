<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MechaniX Power Tool v5.0</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MPT" />
<meta name="theme-color" content="#1a6ef5" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap');

  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #d8dce4;
    --border2: #c4c9d4;
    --accent: #1a6ef5;
    --accent2: #0f4fc2;
    --accent-soft: #e8f0fe;
    --text: #1a1d23;
    --text2: #4a5068;
    --text3: #7a8099;
    --success: #12a05c;
    --warn: #d97706;
    --danger: #dc2626;
    --mono: 'Share Tech Mono', monospace;
    --head: 'Rajdhani', sans-serif;
    --body: 'Exo 2', sans-serif;
    --radius: 8px;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --shadow2: 0 4px 20px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── HEADER ── */
  #app-header {
    background: linear-gradient(135deg, #0d1117 0%, #161b26 60%, #1a2236 100%);
    border-bottom: 2px solid var(--accent);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  #app-header .logo {
    font-family: var(--head);
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }
  #app-header .logo span { color: var(--accent); }
  #app-header .version {
    font-family: var(--mono);
    font-size: 11px;
    color: #5a6a8a;
    margin-left: 10px;
  }
  #app-header .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #commissioner-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: #8a9bc4;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 4px 10px;
    border-radius: 4px;
  }

  /* ── LAYOUT ── */
  #main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 56px);
    gap: 0;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 48px;
    width: 380px;
    box-shadow: var(--shadow2);
    text-align: center;
  }
  .login-card h2 {
    font-family: var(--head);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }
  .login-card p {
    color: var(--text3);
    margin-bottom: 28px;
    font-size: 13px;
  }
  .login-card input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    font-family: var(--body);
    font-size: 14px;
    background: var(--surface2);
    color: var(--text);
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .login-card input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: var(--head);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
  #login-error { color: var(--danger); font-size: 12px; margin-top: 10px; }

  /* ── LEAGUE PICKER ── */
  #league-screen { display: none; }
  .section-title {
    font-family: var(--head);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    letter-spacing: 0.3px;
  }
  .league-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .league-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .league-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
  .league-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .league-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--border);
    flex-shrink: 0;
  }
  .league-card .lc-info { flex: 1; min-width: 0; }
  .league-card .lc-name {
    font-family: var(--head);
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .league-card .lc-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }

  /* ── PROGRESS BAR ── */
  #progress-wrap { display: none; margin-bottom: 20px; }
  #progress-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; font-family: var(--mono); }
  #progress-track {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #5b9af8);
    border-radius: 3px;
    width: 0%;
    transition: width 0.3s ease;
  }

  /* ── STATS STRIP ── */
  #stats-strip {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    text-align: center;
  }
  .stat-chip .sc-val {
    font-family: var(--head);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-chip .sc-label { font-size: 11px; color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── TOOLBAR ── */
  #toolbar {
    display: none;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .btn-sm {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text2);
    font-family: var(--body);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn-sm.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-sm.accent:hover { background: var(--accent2); border-color: var(--accent2); }
  #toolbar-league-name {
    font-family: var(--head);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
  }

  /* ── GLOBAL PACKETS GRID ── */
  #global-packets { display: none; margin-bottom: 28px; }
  .packets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .packet-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .packet-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .packet-btn .pb-icon { font-size: 20px; }
  .packet-btn .pb-label { font-family: var(--head); font-size: 14px; font-weight: 600; color: var(--text); }
  .packet-btn .pb-desc { font-size: 11px; color: var(--text3); }

  /* ── TEAMS TABLE ── */
  #teams-section { display: none; margin-bottom: 28px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  thead th {
    background: #f0f2f5;
    padding: 10px 12px;
    text-align: left;
    font-family: var(--head);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 10px 12px; font-size: 13px; }
  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    background: var(--border);
    color: var(--text2);
  }
  .rank-badge.gold { background: #fbbf24; color: #78350f; }
  .rank-badge.silver { background: #d1d5db; color: #374151; }
  .rank-badge.bronze { background: #d97706; color: #fff; }
  .team-btns { display: flex; gap: 6px; }
  .team-btns button {
    padding: 4px 9px;
    font-size: 11px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    font-family: var(--body);
    transition: all 0.1s;
  }
  .team-btns button:hover { border-color: var(--accent); color: var(--accent); }
  .record { font-family: var(--mono); font-size: 12px; }
  .pts { font-family: var(--mono); font-size: 12px; color: var(--text2); }

  /* ── MODAL ── */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: var(--surface);
    border-radius: 12px;
    width: 100%;
    max-width: 760px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    max-height: 85vh;
  }
  #modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #modal-title {
    font-family: var(--head);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  #modal-actions { display: flex; gap: 8px; }
  #modal-close {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    font-size: 16px;
    color: var(--text2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #modal-close:hover { background: var(--border); }
  #modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }
  #modal-textarea {
    width: 100%;
    min-height: 420px;
    border: none;
    outline: none;
    resize: none;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    padding: 16px 20px;
    background: #1a1d23;
    color: #c9d1e0;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
  }
  #copy-status {
    font-size: 12px;
    color: var(--success);
    font-family: var(--mono);
    min-width: 80px;
    text-align: right;
    align-self: center;
  }

  /* ── MISC ── */
  .tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid #c5d8fd;
  }
  .tag.pos-QB { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .tag.pos-RB { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
  .tag.pos-WR { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
  .tag.pos-TE { background: #fce7f3; color: #9d174d; border-color: #fbcfe8; }
  .tag.pos-K  { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
  .tag.pos-DEF { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
  .tag.pos-FLEX, .tag.pos-SUPER_FLEX { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
  .empty-state {
    text-align: center;
    padding: 48px;
    color: var(--text3);
    font-size: 14px;
  }
  .empty-state .es-icon { font-size: 36px; margin-bottom: 12px; }
  .loader {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .info-row { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 8px; }
  .info-kv { font-size: 13px; }
  .info-kv .k { color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; font-family: var(--mono); }
  .info-kv .v { font-weight: 600; }

  /* Section within modal */
  .modal-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-section:last-child { border-bottom: none; }
  .modal-section h4 { font-family: var(--head); font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }

  .roster-group { margin-bottom: 14px; }
  .roster-group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3); margin-bottom: 6px; font-family: var(--mono); }
  .roster-player { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .roster-player:last-child { border-bottom: none; }
  .roster-player .rp-name { flex: 1; font-weight: 500; }
  .roster-player .rp-team { color: var(--text3); font-size: 11px; font-family: var(--mono); min-width: 32px; }
  .roster-player .rp-pts { font-family: var(--mono); font-size: 12px; color: var(--text2); min-width: 50px; text-align: right; }
  .roster-player .rp-proj { font-family: var(--mono); font-size: 12px; color: var(--accent); min-width: 50px; text-align: right; }
  .roster-player .rp-age { font-size: 11px; color: var(--text3); min-width: 30px; text-align: center; }
  .roster-player .rp-exp { font-size: 11px; color: var(--text3); min-width: 25px; text-align: center; }
  .col-hdr { display: flex; gap: 8px; padding: 4px 0; border-bottom: 2px solid var(--border); margin-bottom: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); font-family: var(--mono); }
  .col-hdr .rp-name { flex: 1; }

  .matchup-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .matchup-row:last-child { border-bottom: none; }
  .matchup-row .mu-week { font-family: var(--mono); font-size: 11px; color: var(--text3); min-width: 48px; }
  .matchup-row .mu-teams { flex: 1; text-align: center; }
  .matchup-row .mu-score { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .mu-win { color: var(--success); }
  .mu-loss { color: var(--danger); }

  .trans-row { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .trans-row:last-child { border-bottom: none; }
  .trans-row .tr-type { min-width: 60px; }
  .trans-row .tr-detail { flex: 1; color: var(--text2); }
  .trans-row .tr-date { font-family: var(--mono); font-size: 11px; color: var(--text3); white-space: nowrap; }

  .fa-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .fa-row:last-child { border-bottom: none; }
  .fa-row .fa-num { font-family: var(--mono); font-size: 11px; color: var(--text3); min-width: 20px; }
  .fa-row .fa-name { flex: 1; font-weight: 500; }
  .fa-row .fa-team { color: var(--text3); font-size: 11px; font-family: var(--mono); min-width: 32px; }
  .fa-row .fa-proj { font-family: var(--mono); font-size: 12px; color: var(--accent); min-width: 60px; text-align: right; }

  .pick-row { display: flex; gap: 10px; padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--border); align-items: center; }
  .pick-row:last-child { border-bottom: none; }

  /* Responsive */
  @media (max-width: 600px) {
    .login-card { width: 100%; padding: 28px 20px; }
    thead th, tbody td { padding: 8px; font-size: 12px; }
    .packets-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header id="app-header">
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="logo">MechaniX <span>Power Tool</span></div>
    <div class="version">v5.0</div>
  </div>
  <div class="header-right">
    <div id="commissioner-badge" style="display:none;"></div>
    <button class="btn-sm" id="btn-logout" style="display:none;font-size:12px;">← Logout</button>
  </div>
</header>

<!-- MAIN -->
<div id="main">

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Commissioner Login</h2>
      <p>Enter your Sleeper username to load your leagues</p>
      <input type="text" id="username-input" placeholder="Sleeper username" autocomplete="off" autocapitalize="none" />
      <button class="btn-primary" id="btn-login">Load Leagues</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- LEAGUE PICKER -->
  <div id="league-screen">
    <div class="section-title" id="league-screen-title">Your Leagues</div>
    <div class="league-grid" id="league-grid"></div>
  </div>

  <!-- PROGRESS -->
  <div id="progress-wrap">
    <div id="progress-label">Loading league data…</div>
    <div id="progress-track"><div id="progress-bar"></div></div>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <div id="toolbar-league-name"></div>
    <button class="btn-sm" id="btn-change-league">↩ Change League</button>
    <button class="btn-sm accent" id="btn-json-download">⬇ JSON</button>
    <button class="btn-sm" id="btn-json-light" style="border-color:#12a05c;color:#12a05c;">⬇ JSON Light</button>
    <button class="btn-sm" id="btn-draft-json" style="display:none;border-color:#d97706;color:#d97706;">🟠 Draft JSON v2</button>
  </div>

  <!-- STATS STRIP -->
  <div id="stats-strip">
    <div class="stat-chip"><div class="sc-val" id="ss-teams">—</div><div class="sc-label">Teams</div></div>
    <div class="stat-chip"><div class="sc-val" id="ss-season">—</div><div class="sc-label">Season</div></div>
    <div class="stat-chip"><div class="sc-val" id="ss-week">—</div><div class="sc-label">Current Week</div></div>
    <div class="stat-chip"><div class="sc-val" id="ss-scoring">—</div><div class="sc-label">Scoring</div></div>
    <div class="stat-chip"><div class="sc-val" id="ss-type">—</div><div class="sc-label">Format</div></div>
  </div>

  <!-- GLOBAL PACKETS -->
  <div id="global-packets">
    <div class="section-title">League Packets</div>
    <div class="packets-grid">
      <button class="packet-btn" onclick="openGlobalPacket('info')"><div class="pb-icon">🏈</div><div class="pb-label">League Info</div><div class="pb-desc">Settings & structure</div></button>
      <button class="packet-btn" onclick="openGlobalPacket('standings')"><div class="pb-icon">📊</div><div class="pb-label">Standings</div><div class="pb-desc">Rankings & records</div></button>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let STATE = {
  username: '',
  userId: '',
  leagues: [],
  activeLeague: null,
  leagueUsers: {},      // user_id -> user obj
  rosters: [],
  matchupsByWeek: {},   // week -> []
  transactions: [],
  tradedPicks: [],
  draftedPicks: {},     // v2.3: player_id -> { season, round, pick_no, draft_slot } draft capital (current + walked-back prior season)
  draftInfo: null,
  playerDB: {},         // player_id -> player obj
  projections: {},      // player_id -> projected pts (upcoming season week)
  seasonProjections: {}, // v5.0: player_id -> projected pts (full upcoming season total)
  seasonProjectionMeta: { source: null, weeks_summed: null }, // v5.0: how seasonProjections was derived — 'season_aggregate_endpoint' or 'weekly_sum_fallback' (weeks_summed only set for fallback)
  playerStats: {},      // player_id -> total scored pts (prior season)
  scoringMap: {},       // position_type -> multiplier map
  currentWeek: 1,
  currentSeason: '',    // projSeason e.g. "2026"
  statsSeason: '',      // statsSeason e.g. "2025" (currentSeason - 1)
  auctionCosts: {},     // player_id -> { cost, roster_id } from all-weeks transactions
  playerStatSplits: {}, // player_id -> { rush_att, rush_yd, rec_tgt, rec, rec_yd, snap_cnt, pass_att, pass_cmp, pass_yd, pass_td, sack, solo_tackle, idp_int }
  statsHistory: {},     // player_id -> { [season]: { gp, pts } } for current + 2 prior seasons (v2.1)
  condensedStats: false,// toggle: condensed stat lines in packets
  prevSeasonData: {     // Y-1 league data via previous_league_id chain
    standings: [],      // array of {roster_id, teamName, owner, wins, losses, ties, fpts, fpts_decimal, fpts_against, fpts_against_decimal}
    matchups: {},       // week -> array
    leagueId: null,
    rosters: [],        // raw prior season rosters (for owner mapping)
    users: {},          // user_id -> user obj
  },
  rookieClass: {},      // v2.7: player_id -> rookie player obj (years_exp === 0), built on demand
  weeklyPts: {},         // v2.8: player_id -> { week_num: pts } for statsSeason, for trend tracking
};

// ══════════════════════════════════════════════
//  SLEEPER API HELPERS
// ══════════════════════════════════════════════
const API = 'https://api.sleeper.app/v1';
const PROJ_API = 'https://api.sleeper.app/projections/nfl';
const STATS_API = 'https://api.sleeper.app/stats/nfl';

async function sleeperGet(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error(`API error: ${res.status} ${path}`);
  return res.json();
}

// Player DB with 24h localStorage cache
async function fetchPlayerDB() {
  const CACHE_KEY = 'spt_playerdb';
  const CACHE_TS  = 'spt_playerdb_ts';
  const TTL = 86400000; // 24h
  const ts = parseInt(localStorage.getItem(CACHE_TS) || '0');
  if (Date.now() - ts < TTL) {
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) return JSON.parse(cached);
    } catch(e) {}
  }
  const res = await fetch('https://api.sleeper.app/v1/players/nfl');
  const db = await res.json();
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(db));
    localStorage.setItem(CACHE_TS, String(Date.now()));
  } catch(e) {}
  return db;
}

async function fetchProjections(season, week) {
  try {
    const res = await fetch(`${PROJ_API}/${season}/${week}?season_type=regular`);
    if (!res.ok) return {};
    const data = await res.json();
    // data is array of {player_id, stats:{...}}
    const map = {};
    for (const p of (data || [])) {
      if (p.player_id) map[p.player_id] = p.stats || {};
    }
    return map;
  } catch(e) { return {}; }
}

// v5.0: full-season projection fetch, added to support an eventual switch from
// 2025-per-game history to 2026 season projections as the Power Rankings basis
// (not yet used for ranking/value logic — this only populates STATE.seasonProjections
// and a coverage metric so the switch-over decision can be made from real data).
//
// Strategy: try Sleeper's season-level endpoint first (no /week segment — per Sleeper's
// own API docs this is a valid call shape that should return full-season projection
// totals directly). This has NOT been live-verified against real 2026 data yet, so we
// validate the response shape before trusting it. If it's missing, empty, or malformed,
// fall back to summing all 18 weekly projection fetches per player — slower (18 calls
// instead of 1) but uses only the already-proven per-week endpoint, so it's safe.
async function fetchSeasonProjections(season, scoringMap) {
  // Attempt 1: season-aggregate endpoint (no week param)
  try {
    const res = await fetch(`${PROJ_API}/${season}?season_type=regular`);
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        const map = {};
        let nonZeroCount = 0;
        for (const p of data) {
          if (!p.player_id) continue;
          const pts = scoreStats(p.stats || {}, scoringMap);
          map[p.player_id] = pts;
          if (pts > 0) nonZeroCount++;
        }
        // Sanity check: if literally everyone came back 0, this endpoint shape
        // probably isn't returning what we expect — treat as invalid and fall through.
        if (nonZeroCount > 0) {
          return { map, meta: { source: 'season_aggregate_endpoint', weeks_summed: null } };
        }
      }
    }
  } catch(e) { /* fall through to weekly-sum fallback */ }

  // Attempt 2: fallback — sum weeks 1-18 using the proven per-week endpoint
  const summed = {};
  let weeksFetched = 0;
  for (let wk = 1; wk <= 18; wk++) {
    const rawWeek = await fetchProjections(season, wk);
    if (Object.keys(rawWeek).length === 0) continue; // week not available yet, skip
    weeksFetched++;
    for (const [pid, stats] of Object.entries(rawWeek)) {
      const pts = scoreStats(stats, scoringMap);
      summed[pid] = (summed[pid] || 0) + pts;
    }
  }
  return { map: summed, meta: { source: 'weekly_sum_fallback', weeks_summed: weeksFetched } };
}

// v2.3: IDP tackle stat key normalization. Sleeper's stats payload uses idp_tkl_solo/idp_tkl_ast
// as the canonical split, but some league/season payloads only carry a combined 'idp_tkl' key
// (no solo/ast split) or use 'idp_tkl_assist' instead of 'idp_tkl_ast'. This backfills the
// canonical keys when the alternates are present and the canonical key is missing, so downstream
// scoring/accumulation doesn't silently drop IDP tackle production. NOTE: this is a best-effort
// normalization based on known Sleeper alternates, not a guarantee every league-type variant is covered.
function normalizeIdpStatKeys(statsObj) {
  if (!statsObj) return statsObj;
  if (statsObj.idp_tkl_solo === undefined && statsObj.idp_tkl !== undefined) {
    statsObj.idp_tkl_solo = statsObj.idp_tkl;
  }
  if (statsObj.idp_tkl_ast === undefined && statsObj.idp_tkl_assist !== undefined) {
    statsObj.idp_tkl_ast = statsObj.idp_tkl_assist;
  }
  return statsObj;
}

async function fetchStats(season, week) {
  try {
    const res = await fetch(`${STATS_API}/${season}/${week}?season_type=regular`);
    if (!res.ok) return {};
    const data = await res.json();
    const map = {};
    for (const p of (data || [])) {
      if (p.player_id) map[p.player_id] = normalizeIdpStatKeys(p.stats || {});
    }
    return map;
  } catch(e) { return {}; }
}

function getScoringLabel(lg) {
  const sc = lg.scoring_settings || {};
  const pos = lg.roster_positions || [];
  const hasIDP = pos.some(p => ['DL','LB','DB','IDP_FLEX'].includes(p));
  const recVal = sc.rec;
  let base = recVal === 1 ? 'PPR' : recVal === 0.5 ? 'Half-PPR' : 'Standard';
  if (hasIDP) base += '+IDP';
  // Check for any non-standard scoring keys beyond basic rec/pass/rush/rec stats
  const customKeys = Object.keys(sc).filter(k => !['rec','pass_yd','pass_td','rush_yd','rush_td','rec_yd','rec_td','pass_int','fum_lost','bonus_rec_te','pass_2pt','rush_2pt','rec_2pt'].includes(k));
  if (customKeys.length > 0 && !hasIDP) base = 'Custom ' + base;
  else if (hasIDP) base = 'Custom ' + base;
  return base;
}
function scoreStats(statsObj, scoringMap) {
  if (!statsObj || !scoringMap) return 0;
  let pts = 0;
  for (const [key, mult] of Object.entries(scoringMap)) {
    if (statsObj[key] !== undefined) pts += statsObj[key] * mult;
  }
  return Math.round(pts * 100) / 100;
}

function buildScoringMap(league) {
  const map = {};
  const sp = league.scoring_settings || {};
  for (const [k, v] of Object.entries(sp)) {
    if (v !== 0) map[k] = v;
  }
  return map;
}

// v2.1: Build games_played_history / pts_history / durability_flag for a player from STATE.statsHistory
// v2.2: Also builds season_stat_history (position-specific basic stats, 3 seasons)
const POS_STAT_KEYS = {
  QB:  ['pass_yd','pass_td','pass_int','rush_yd','rush_td'],
  RB:  ['rush_att','rush_yd','rush_td','rec','rec_yd','kr_yd','pr_yd'],
  WR:  ['rec','rec_yd','rec_td','kr_yd','pr_yd'],
  TE:  ['rec','rec_yd','rec_td'],
  LB:  ['idp_tkl_solo','idp_tkl_ast','idp_sack','idp_int','idp_ff'],
  DL:  ['idp_tkl_solo','idp_tkl_ast','idp_sack','idp_int','idp_ff'],
  DB:  ['idp_tkl_solo','idp_tkl_ast','idp_sack','idp_int','idp_ff'],
  K:   ['fgm','fga','xpm'],
  // v4.3: team-defense scoring fields, added so season_stat_history.stats is no longer
  // always null for DEF (see buildDurabilityProfile). Not used to gate games-played —
  // see the v4.3 DEF carve-out in the didPlay checks below, since a defense can record
  // zero of these events in a real, fully-played game.
  DEF: ['sack','int','fum_rec','ff','safe','blk_kick','def_td'],
};
// v3.7: Sleeper's weekly stats payload omits 'gp' for untracked positions (OL, FB, LS, G, T, C, NT, P).
// The old fallback (any non-empty stats object = played) falsely inflated games-played counts for
// these positions, since inactive/practice-squad weeks can still produce a non-empty stats object.
// Fix: only trust key-presence as a "played" signal for positions we actually track stats for.
function isTrackedStatPosition(pos) {
  const posKey = pos === 'DE' || pos === 'DT' ? 'DL' : pos === 'CB' ? 'DB' : pos;
  return !!POS_STAT_KEYS[posKey];
}
function buildDurabilityProfile(pid, pos) {
  const hist = STATE.statsHistory[pid];
  const histSeasons = [
    parseInt(STATE.statsSeason),
    parseInt(STATE.statsSeason) - 1,
    parseInt(STATE.statsSeason) - 2,
  ];
  const [curY, priorY, twoAgoY] = histSeasons.map(String);
  const gpCur = hist?.[curY]?.gp;
  const gpPrior = hist?.[priorY]?.gp;
  const gpTwoAgo = hist?.[twoAgoY]?.gp;
  // v3.11: renamed 'current_season' -> 'most_recent_season' in games_played_history/pts_history/
  // season_stat_history. These 3 keys are anchored to STATE.statsSeason (currentSeason - 1), so the
  // old 'current_season' label actually meant "most recent completed season" (e.g. 2025 when the real
  // current season is 2026) — which collided in meaning with the separate top-level pts_prior_season
  // field (also 2025), even though the two were never wired together incorrectly. Renaming removes the
  // false-mismatch confusion without changing any values.
  const games_played_history = {
    most_recent_season: gpCur !== undefined ? gpCur : null,
    prior_season: gpPrior !== undefined ? gpPrior : null,
    two_seasons_ago: gpTwoAgo !== undefined ? gpTwoAgo : null,
  };
  const pts_history = {
    most_recent_season: hist?.[curY]?.pts !== undefined ? hist[curY].pts : null,
    prior_season: hist?.[priorY]?.pts !== undefined ? hist[priorY].pts : null,
    two_seasons_ago: hist?.[twoAgoY]?.pts !== undefined ? hist[twoAgoY].pts : null,
  };
  // Durability flag: based on games missed in current + prior season (17-game season assumed)
  let durability_flag = 'insufficient_data';
  if (gpCur !== undefined && gpPrior !== undefined) {
    const missedCur = Math.max(0, 17 - gpCur);
    const missedPrior = Math.max(0, 17 - gpPrior);
    if (missedCur >= 3 && missedPrior >= 3) {
      durability_flag = 'chronic';
    } else if (missedCur >= 4 && missedPrior <= 1 && gpTwoAgo !== undefined && (17 - gpTwoAgo) <= 1) {
      durability_flag = 'injury_isolated';
    } else if (missedCur >= 3 || missedPrior >= 3) {
      durability_flag = 'watch';
    } else {
      durability_flag = 'stable';
    }
  }
  // v2.2: season_stat_history — position-specific basic stats for all 3 seasons
  // Maps DE/DT -> DL, CB -> DB for IDP position key lookup
  const posKey = pos === 'DE' || pos === 'DT' ? 'DL' : pos === 'CB' ? 'DB' : pos;
  const statKeys = POS_STAT_KEYS[posKey] || null;
  const season_stat_history = histSeasons.map((yr, i) => {
    const yStr = String(yr);
    const label = i === 0 ? 'most_recent_season' : i === 1 ? 'prior_season' : 'two_seasons_ago';
    const entry = hist?.[yStr];
    if (!entry) return { season: yStr, label, gp: null, stats: null };
    const stats = {};
    if (statKeys && entry.acc) {
      for (const k of statKeys) {
        stats[k] = entry.acc[k] ? Math.round(entry.acc[k] * 10) / 10 : 0;
      }
    }
    return { season: yStr, label, gp: entry.gp || 0, stats: statKeys ? stats : null };
  });
  return { games_played_history, pts_history, durability_flag, season_stat_history };
}

// v2.8: Injury freshness flag. Sleeper's player object carries injury_status
// (e.g. "Questionable", "IR") but no built-in signal for whether that tag is
// current news or a stale leftover from weeks ago. This checks injury_start_date
// first (when Sleeper provides it), falling back to news_updated (epoch ms) as
// the next-best signal of when the player's record last changed. If neither
// date is present, returns 'unknown_no_date' rather than guessing — never
// fabricate a freshness read with no timestamp to back it.
function buildInjuryFreshness(pid) {
  const p = STATE.playerDB[pid];
  if (!p) return null;
  const status = p.injury_status || null;
  if (!status) return { status: null, freshness: 'healthy', days_since_update: null };
  let refDateMs = null;
  if (p.injury_start_date) {
    const d = new Date(p.injury_start_date);
    if (!isNaN(d.getTime())) refDateMs = d.getTime();
  }
  if (refDateMs === null && p.news_updated) {
    const n = parseInt(p.news_updated, 10);
    if (!isNaN(n)) refDateMs = n;
  }
  if (refDateMs === null) {
    return { status, freshness: 'unknown_no_date', days_since_update: null };
  }
  const daysSince = Math.floor((Date.now() - refDateMs) / 86400000);
  let freshness;
  if (daysSince < 0) freshness = 'unknown_no_date'; // future-dated source data, don't trust it
  else if (daysSince <= 3) freshness = 'fresh';      // reported in the last 3 days — treat as current
  else if (daysSince <= 14) freshness = 'active';    // within 2 weeks — still likely relevant
  else freshness = 'stale';                          // tag hasn't moved in 14+ days — verify before trusting
  return { status, freshness, days_since_update: daysSince };
}

// v2.8: Weekly trend tracking. Compares a player's last 3 played weeks (of
// STATE.weeklyPts, drawn from statsSeason) against their full-season weekly
// average to flag whether they finished the season hot, cooling off, or
// steady. Needs at least 4 played weeks on record to compare a meaningful
// "recent" window against a season baseline — below that, returns
// 'insufficient_data' rather than guessing a trend off 1-2 data points.
function buildWeeklyTrend(pid) {
  const weeks = STATE.weeklyPts[pid];
  if (!weeks) return { trend: 'insufficient_data', recent_avg: null, season_avg: null, weeks_played: 0 };
  const playedWeeks = Object.keys(weeks).map(Number).sort((a, b) => a - b);
  if (playedWeeks.length < 4) {
    return { trend: 'insufficient_data', recent_avg: null, season_avg: null, weeks_played: playedWeeks.length };
  }
  const allPts = playedWeeks.map(w => weeks[w]);
  const seasonAvg = allPts.reduce((s, v) => s + v, 0) / allPts.length;
  const last3 = playedWeeks.slice(-3).map(w => weeks[w]);
  const recentAvg = last3.reduce((s, v) => s + v, 0) / last3.length;
  let trend;
  if (seasonAvg === 0) {
    trend = recentAvg > 0 ? 'trending_up' : 'insufficient_data';
  } else if (recentAvg >= seasonAvg * 1.15) {
    trend = 'trending_up';
  } else if (recentAvg <= seasonAvg * 0.85) {
    trend = 'trending_down';
  } else {
    trend = 'steady';
  }
  return {
    trend,
    recent_avg: Math.round(recentAvg * 100) / 100,
    season_avg: Math.round(seasonAvg * 100) / 100,
    weeks_played: playedWeeks.length,
  };
}

// v2.8: FAAB efficiency tracker. Aggregates STATE.auctionCosts (FAAB bids /
// auction costs already resolved per player from transactions, keyed by
// player_id -> { cost, roster_id }) against STATE.playerStats (statsSeason
// points scored) to surface $ spent vs. points returned, per roster.
// NOTE: STATE.auctionCosts also captures startup-auction costs in auction-
// format leagues (not just in-season FAAB waiver wins) — this reflects the
// existing field's scope, not a new ambiguity introduced here. pts_per_dollar
// is left null (never 0) when a roster has $0 tracked spend, to avoid a
// division-by-zero standing in as a real efficiency score.
function buildFaabEfficiency() {
  const rosterMap = {};
  STATE.rosters.forEach(r => { rosterMap[r.roster_id] = r; });
  const byRoster = {};
  for (const [pid, info] of Object.entries(STATE.auctionCosts)) {
    const rid = info?.roster_id;
    if (rid === undefined || rid === null) continue;
    if (!byRoster[rid]) byRoster[rid] = { roster_id: rid, total_spent: 0, total_pts: 0, player_count: 0, players: [] };
    const cost = info.cost || 0;
    const pts = STATE.playerStats[pid] !== undefined ? STATE.playerStats[pid] : null;
    byRoster[rid].total_spent += cost;
    byRoster[rid].player_count += 1;
    if (pts !== null) byRoster[rid].total_pts += pts;
    const p = STATE.playerDB[pid] || {};
    byRoster[rid].players.push({
      player_id: pid,
      name: p.full_name || (p.first_name ? `${p.first_name} ${p.last_name}` : pid),
      cost,
      pts_scored: pts,
    });
  }
  const result = Object.values(byRoster).map(r => {
    const teamName = rosterMap[r.roster_id] ? getRosterOwner(rosterMap[r.roster_id]).teamName : `Roster ${r.roster_id}`;
    return {
      roster_id: r.roster_id,
      team_name: teamName,
      total_spent: Math.round(r.total_spent * 100) / 100,
      total_pts: Math.round(r.total_pts * 100) / 100,
      player_count: r.player_count,
      pts_per_dollar: r.total_spent > 0 ? Math.round((r.total_pts / r.total_spent) * 100) / 100 : null,
      players: r.players.sort((a, b) => (b.pts_scored || 0) - (a.pts_scored || 0)),
    };
  });
  result.sort((a, b) => (b.pts_per_dollar ?? -1) - (a.pts_per_dollar ?? -1));
  return result;
}

// v5.0: coverage metric for STATE.seasonProjections, added to let Leo (or Claude)
// judge objectively when "a majority of 2026 projections are in" rather than by feel.
// Coverage = % of ROSTERED players with a nonzero season projection, overall and by
// position group. Free agents are intentionally excluded — the switch decision should
// be based on whether starters/rostered depth are covered, not the whole player pool
// (deep waiver-wire players may never get individual projections, which is normal and
// shouldn't block the switch).
function buildProjectionCoverage() {
  const byPos = {}; // pos -> { total, projected }
  let total = 0, projected = 0;
  const seen = new Set();
  STATE.rosters.forEach(r => {
    (r.players || []).forEach(pid => {
      if (seen.has(pid)) return; // a player can't be on two rosters, but guard anyway
      seen.add(pid);
      const p = STATE.playerDB[pid] || {};
      const pos = p.position || 'UNK';
      if (!byPos[pos]) byPos[pos] = { total: 0, projected: 0 };
      total++;
      byPos[pos].total++;
      const proj = STATE.seasonProjections[pid];
      const hasProjection = proj !== undefined && proj !== null && proj !== 0;
      if (hasProjection) { projected++; byPos[pos].projected++; }
    });
  });
  const by_position = {};
  for (const [pos, v] of Object.entries(byPos)) {
    by_position[pos] = {
      total: v.total,
      projected: v.projected,
      pct: v.total > 0 ? Math.round((v.projected / v.total) * 1000) / 10 : null,
    };
  }
  return {
    source: STATE.seasonProjectionMeta.source,
    weeks_summed: STATE.seasonProjectionMeta.weeks_summed,
    overall_pct: total > 0 ? Math.round((projected / total) * 1000) / 10 : null,
    total_rostered_players: total,
    total_with_projection: projected,
    by_position,
  };
}

// ══════════════════════════════════════════════
//  v2.7: SHARED DRAFT-VALUE HELPERS
//  Used by keeper/draft-value calculator, live draft tracking,
//  and rookie class layer. NOTE: prior memory referenced these as
//  "already started" — they were NOT present in the v2.6 codebase.
//  Built fresh here; flagging that discrepancy per data-integrity rule.
// ══════════════════════════════════════════════

// Parse a pick label like "1.07" or "2.12" into { round, slot }.
// Returns null if the label doesn't match the expected R.SS format.
function parsePickLabel(label) {
  if (!label || typeof label !== 'string') return null;
  const m = label.trim().match(/^(\d+)\.(\d{1,2})$/);
  if (!m) return null;
  return { round: parseInt(m[1], 10), slot: parseInt(m[2], 10) };
}

// Estimate the trade value of a draft pick (current or future, own or traded).
// Reuses the existing pick-decay formula already standing for computeDraftCapital-
// style ledgers: 100 * 0.45^(round-1) * 0.9^yearsOut, then nudges by slot position
// within the round (early-round-1 picks worth meaningfully more than late ones;
// the gap narrows in later rounds).
// Params: { season, round, slot, totalRosters, currentSeason }
// All params except round are optional; missing slot/totalRosters skips the
// within-round adjustment rather than fabricating a default rank.
function pickEstimatedValue({ season, round, slot, totalRosters, currentSeason, totalRounds } = {}) {
  if (!round || round < 1) return null; // no fabricated values without a round
  const yearsOut = (season && currentSeason) ? Math.max(0, parseInt(season, 10) - parseInt(currentSeason, 10)) : 0;
  // v3.7: decay rate solved from the draft's actual totalRounds instead of a fixed 0.45 constant.
  // The fixed rate was never calibrated against round count: in a 25-round league it was already
  // crushed to sub-1 "noise" by round ~10 and rounded to a flat 0.00 for every pick round 14+
  // (100 * 0.45^13 = 0.003, underflows at 2-decimal rounding). Root-caused against live draft data
  // before this fix — see round-by-round verification in conversation.
  // Anchors: round 1 = 100 (unchanged, matches the existing PICK_TO_PLAYER_VALUE_SCALE assumption),
  // last round = 1.0 (a 100x span top to bottom). Solved as r = 0.01^(1/(totalRounds-1)) so every
  // round stays distinct and nonzero regardless of league length (24-round, 25-round, 38-round, etc).
  // Falls back to the original 0.45 rate only when totalRounds isn't known at the call site (e.g.
  // scoring a traded future-season pick, where that season's draft may not be configured yet) —
  // never guesses a round count.
  const decayRate = (totalRounds && totalRounds > 1) ? Math.pow(0.01, 1 / (totalRounds - 1)) : 0.45;
  let base = 100 * Math.pow(decayRate, round - 1) * Math.pow(0.9, yearsOut);
  let withinRoundAdj = 1;
  if (slot && totalRosters && totalRosters > 1) {
    // Linear taper from 1.15x (pick .01) to 0.90x (last slot in round), tighter in later rounds
    const taperRange = round === 1 ? 0.25 : round === 2 ? 0.15 : 0.07;
    const frac = (slot - 1) / (totalRosters - 1); // 0 at top of round, 1 at bottom
    withinRoundAdj = 1 + (taperRange / 2) - (frac * taperRange);
  }
  return Math.round(base * withinRoundAdj * 100) / 100;
}

// v3.1: Draft pick values from pickEstimatedValue() live on a 0-100ish scale,
// while player values from getPlayerValue() live on a season-points scale
// (commonly 150-300+ for starters). Combining raw pick + player values on the
// same trade side (scoreTradeSide, buildKeeperValueRow) silently understated
// every pick's real weight relative to players. This scales pick value onto
// the player-value scale before combining. Multiplier derived empirically:
// a true 1st-round pick (~100 raw) should land near a low-end starter
// (~180 player-scale), so 100 * 1.8 = 180.
const PICK_TO_PLAYER_VALUE_SCALE = 1.8;
function scaledPickValue(pickInfo) {
  const raw = pickEstimatedValue(pickInfo);
  if (raw === null) return null;
  return Math.round(raw * PICK_TO_PLAYER_VALUE_SCALE * 100) / 100;
}

// Estimate a player's current trade/keeper value on a 0-100ish scale, anchored
// to projected points for the upcoming season plus a durability/recency check.
// This is intentionally simple and transparent (no hidden weighting tiers) so
// it can be sanity-checked against STATE data directly. Returns null (never 0
// or a guessed number) when projection data is missing for the player.
// v3.1: Core valuation logic moved into getPlayerValueDetail() to support a
// fallback path (prior-season stats + recent-trend adjustment) for the
// offseason gap when STATE.projections has nothing yet. getPlayerValue()
// remains a thin wrapper returning just the number, so existing callers are
// unaffected.
function getPlayerValueDetail(pid) {
  if (!pid) return null;
  const p = STATE.playerDB[pid] || {};
  let value = null;
  let basis = null;
  let isEstimated = false;
  const proj = STATE.projections[pid];
  // v3.2 fix: Sleeper returns a literal 0 (not null/undefined) for IDP/K
  // projections — a known platform-wide gap, not missing data in the usual
  // sense. The original check only treated null/undefined as "missing", so
  // IDP/K player_value silently came out as 0 instead of using the fallback.
  // Treating a falsy (0) projection the same as missing routes IDP/K through
  // the prior-season-adjusted fallback like any other unprojected player.
  if (proj !== undefined && proj !== null && proj !== 0) {
    value = proj;
    basis = 'season_projection';
    // v3.5 fix: Sleeper's season projections never include return yardage (kr_yd/pr_yd)
    // for ANY player — it's not part of their projection model, not a per-player gap.
    // A returner's full value was silently dropping out here (e.g. a player projected
    // purely on WR/RB role while their actual prior-season return production, now
    // correctly captured via ACCUM_STAT_KEYS, went unused). Add an estimated per-season
    // return-yard point total on top of the role projection, using the most recent
    // season with recorded return stats, scaled to a per-week-then-back-to-season basis
    // to match how `proj` (currently a per-week figure) combines with downstream usage.
    const hist = STATE.statsHistory[pid];
    if (hist) {
      const seasonsDesc = Object.keys(hist).sort((a, b) => b - a);
      for (const yr of seasonsDesc) {
        const acc = hist[yr]?.acc;
        const krYd = acc?.kr_yd || 0;
        const prYd = acc?.pr_yd || 0;
        if (krYd || prYd) {
          const krPts = krYd * (STATE.scoringMap.kr_yd || 0);
          const prPts = prYd * (STATE.scoringMap.pr_yd || 0);
          const gp = hist[yr]?.gp || 17;
          value += (krPts + prPts) / gp; // per-week return-yard rate, added to per-week proj
          basis = 'season_projection_plus_return_yardage';
          break; // most recent season with return data wins
        }
      }
    }
  } else {
    // Fallback: no season-long projection available yet (offseason gap before
    // Sleeper releases them). Use prior season's actual points, adjusted by
    // the player's recent-vs-season trend ratio as a situational-outlook
    // proxy — capped at ±30% so a small recent sample can't swing the
    // estimate wildly. Never fabricates a number when prior-season stats are
    // also missing — returns null instead.
    const priorPts = STATE.playerStats[pid];
    if (priorPts === undefined || priorPts === null) return null; // never fabricate
    // v4.5 fix: priorPts is a SEASON TOTAL (summed across all 18 weeks in the
    // stats-fetch loop), but the primary branch above (`value = proj`) is a
    // PER-WEEK figure. Multiplying priorPts directly by trendRatio and
    // assigning it to the same `value` slot returned season-scale numbers
    // (100-400+) mislabeled as per-week player_value — ~17x inflation,
    // confirmed via 99 affected IDP free agents in the July 25 PLAYERZ BALL
    // export (proj_current_week: 0, player_value up to 409). Divide by the
    // player's actual games-played in STATE.statsSeason first — STATE.weeklyPts[pid]
    // is already populated (one entry per played week) by this point in the
    // fetch pipeline, so its key count is the precise gp for this exact point
    // total, no reordering needed. Falls back to 17 (full season) only if no
    // weekly entries exist at all, matching the same fallback used for the
    // return-yardage per-week conversion above.
    const gp = STATE.weeklyPts[pid] ? Object.keys(STATE.weeklyPts[pid]).length : 0;
    const priorPtsPerWeek = priorPts / (gp || 17);
    const trend = buildWeeklyTrend(pid);
    let trendRatio = 1;
    if (trend.recent_avg !== null && trend.season_avg !== null && trend.season_avg > 0) {
      trendRatio = trend.recent_avg / trend.season_avg;
      trendRatio = Math.max(0.7, Math.min(1.3, trendRatio)); // cap ±30%
    }
    value = priorPtsPerWeek * trendRatio;
    basis = 'prior_season_trend_adjusted';
    isEstimated = true;
  }
  const durability = buildDurabilityProfile(pid, p.position);
  // Mild durability adjustment: penalize recent missed-time, never invent missing history
  // v3.0 bug fix: buildDurabilityProfile() actually returns 'chronic' | 'injury_isolated' |
  // 'watch' | 'stable' | 'insufficient_data' — the previous checks here ('injury_risk',
  // 'limited_sample') never matched any real return value and were dead code. Corrected
  // to use the real flag set.
  if (durability?.durability_flag === 'chronic') value *= 0.88;
  else if (durability?.durability_flag === 'watch') value *= 0.95;
  else if (durability?.durability_flag === 'injury_isolated') value *= 0.97;
  // Mild age/youth premium for keeper context only on skill positions with known age
  if (p.age && ['RB', 'WR', 'TE', 'QB'].includes(p.position)) {
    if (p.age <= 24) value *= 1.05;
    else if (p.age >= 30) value *= 0.95;
  }
  return {
    value: Math.round(value * 100) / 100,
    is_estimated: isEstimated,
    basis,
  };
}

function getPlayerValue(pid) {
  const detail = getPlayerValueDetail(pid);
  return detail ? detail.value : null;
}

// v2.7: Keeper / draft-value calculator — compares a player's getPlayerValue()
// against the estimated value of the draft pick cost to acquire/keep them.
// Surfaces straightforward signal: KEEP (value > pick cost), EVEN, or
// FORFEIT_VALUE (pick cost > player value) — no hidden scoring tiers.
// v3.1: pick cost now scaled onto the player-value scale via scaledPickValue()
// (was comparing raw 0-100 pick value directly against 150-300+ player value).
// FAIR/KEEP threshold widened 5->15 to match the now player-scaled totals.
function buildKeeperValueRow(pid, pickInfo, totalRosters, currentSeason) {
  const playerValue = getPlayerValue(pid);
  const pickValue = scaledPickValue({ ...pickInfo, totalRosters, currentSeason });
  let verdict = '—';
  if (playerValue !== null && pickValue !== null) {
    const diff = playerValue - pickValue;
    verdict = diff > 15 ? 'KEEP (value+)' : diff < -15 ? 'FORFEIT_VALUE' : 'EVEN';
  }
  return { player_id: pid, player_value: playerValue, pick_value: pickValue, verdict };
}

// v2.7: Rookie class data layer. Builds from STATE.playerDB (already fetched
// via fetchPlayerDB) by filtering years_exp === 0. No separate prospect-grade
// data source is wired in yet — that needs a confirmed source from Leo before
// adding (Sleeper's player DB has no scouting grades). Flag this gap to user.
function buildRookieClass() {
  const rookies = {};
  for (const [pid, p] of Object.entries(STATE.playerDB || {})) {
    if (p && p.years_exp === 0 && p.position) {
      rookies[pid] = {
        player_id: pid,
        name: p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim(),
        position: p.position,
        nfl_team: p.team || '—',
        age: p.age || null,
        proj: STATE.projections[pid] !== undefined ? STATE.projections[pid] : null,
        draft_capital: STATE.draftedPicks[pid] || null, // NFL draft capital if pulled in, else null
        player_value: getPlayerValue(pid),
      };
    }
  }
  STATE.rookieClass = rookies;
  return rookies;
}

// ══════════════════════════════════════════════
//  PRIOR SEASON DATA (previous_league_id chain)
// ══════════════════════════════════════════════
async function fetchPriorSeasonData(currentLeague) {
  const prevId = currentLeague.previous_league_id;
  if (!prevId || prevId === '0') return; // no prior season linked
  try {
    // Fetch prior league info, rosters, users, and matchups
    const [prevRosters, prevUsers, prevLeague] = await Promise.all([
      sleeperGet(`/league/${prevId}/rosters`),
      sleeperGet(`/league/${prevId}/users`),
      sleeperGet(`/league/${prevId}`),
    ]);
    const userMap = {};
    (prevUsers || []).forEach(u => { userMap[u.user_id] = u; });
    STATE.prevSeasonData.leagueId = prevId;
    STATE.prevSeasonData.rosters = prevRosters || [];
    STATE.prevSeasonData.users = userMap;

    // Build standings from prior rosters
    STATE.prevSeasonData.standings = (prevRosters || []).map(r => {
      const u = userMap[r.owner_id];
      return {
        roster_id: r.roster_id,
        teamName: u?.metadata?.team_name || u?.display_name || 'Team ' + r.roster_id,
        owner: u?.display_name || '—',
        wins: r.settings?.wins || 0,
        losses: r.settings?.losses || 0,
        ties: r.settings?.ties || 0,
        fpts: r.settings?.fpts || 0,
        fpts_decimal: r.settings?.fpts_decimal || 0,
        fpts_against: r.settings?.fpts_against || 0,
        fpts_against_decimal: r.settings?.fpts_against_decimal || 0,
      };
    }).sort((a, b) => {
      if (b.wins !== a.wins) return b.wins - a.wins;
      return (b.fpts + b.fpts_decimal/100) - (a.fpts + a.fpts_decimal/100);
    });

    // Fetch prior season matchups (up to 18 weeks)
    STATE.prevSeasonData.matchups = {};
    const totalWeeks = prevLeague?.settings?.playoff_week_start || 15;
    const wPromises = [];
    for (let w = 1; w <= totalWeeks; w++) {
      wPromises.push(
        sleeperGet(`/league/${prevId}/matchups/${w}`)
          .then(data => { if (data && data.length) STATE.prevSeasonData.matchups[w] = data; })
          .catch(() => {})
      );
    }
    await Promise.all(wPromises);
  } catch(e) {
    // Prior season fetch is best-effort — don't break load
    console.warn('Prior season fetch failed:', e);
  }
}

function setProgress(pct, label) {
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = label;
}
function showProgress(label) {
  document.getElementById('progress-wrap').style.display = 'block';

}
function hideProgress() {
  document.getElementById('progress-wrap').style.display = 'none';
}

// ══════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════
document.getElementById('btn-login').onclick = doLogin;
document.getElementById('username-input').onkeydown = e => { if (e.key === 'Enter') doLogin(); };

async function doLogin() {
  const input = document.getElementById('username-input');
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  const username = input.value.trim().toLowerCase();
  if (!username) return;
  errEl.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>Loading…';
  try {
    const user = await sleeperGet(`/user/${username}`);
    if (!user || !user.user_id) throw new Error('User not found');
    STATE.username = user.display_name || username;
    STATE.userId = user.user_id;
    const nflState = await sleeperGet('/state/nfl');
    STATE.currentWeek = nflState.week || 1;
    STATE.currentSeason = nflState.season || String(new Date().getFullYear());
    STATE.statsSeason = String(parseInt(STATE.currentSeason) - 1); // e.g. "2025"
    const leagues = await sleeperGet(`/user/${user.user_id}/leagues/nfl/${STATE.currentSeason}`);
    STATE.leagues = leagues || [];
    showLeagueScreen();
  } catch(err) {
    errEl.textContent = err.message || 'Login failed. Check your username.';
  }
  btn.disabled = false;
  btn.innerHTML = 'Load Leagues';
}

function showLeagueScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('league-screen').style.display = 'block';
  document.getElementById('commissioner-badge').style.display = 'block';
  document.getElementById('commissioner-badge').textContent = '👤 ' + STATE.username;
  document.getElementById('btn-logout').style.display = 'block';
  renderLeagueGrid();
}

function renderLeagueGrid() {
  const grid = document.getElementById('league-grid');
  document.getElementById('league-screen-title').textContent = `Your Leagues (${STATE.currentSeason})`;
  grid.innerHTML = '';
  if (!STATE.leagues.length) {
    grid.innerHTML = '<div class="empty-state"><div class="es-icon">🏈</div><div>No leagues found for this season.</div></div>';
    return;
  }
  STATE.leagues.forEach(lg => {
    const card = document.createElement('div');
    card.className = 'league-card';
    const avatar = lg.avatar ? `https://sleepercdn.com/avatars/thumbs/${lg.avatar}` : '';
    card.innerHTML = `
      ${avatar ? `<img class="league-icon" src="${avatar}" onerror="this.style.display='none'" />` : '<div class="league-icon"></div>'}
      <div class="lc-info">
        <div class="lc-name">${esc(lg.name)}</div>
        <div class="lc-meta">${lg.total_rosters} teams · ${lg.settings?.type === 2 ? 'Dynasty' : lg.settings?.type === 1 ? 'Keeper' : 'Redraft'} · ${getScoringLabel(lg)}</div>
      </div>`;
    card.onclick = () => loadLeague(lg);
    grid.appendChild(card);
  });
}

// ══════════════════════════════════════════════
//  LOAD LEAGUE
// ══════════════════════════════════════════════
async function loadLeague(lg) {
  STATE.activeLeague = lg;
  STATE.scoringMap = buildScoringMap(lg);
  document.getElementById('league-screen').style.display = 'none';
  showProgress('Loading league data…');

  try {
    setProgress(5, 'Fetching player database…');
    STATE.playerDB = await fetchPlayerDB();

    setProgress(20, 'Fetching rosters…');
    STATE.rosters = await sleeperGet(`/league/${lg.league_id}/rosters`);

    setProgress(30, 'Fetching users…');
    const users = await sleeperGet(`/league/${lg.league_id}/users`);
    STATE.leagueUsers = {};
    (users || []).forEach(u => { STATE.leagueUsers[u.user_id] = u; });

    setProgress(40, 'Fetching matchup history…');
    const totalWeeks = lg.settings?.playoff_week_start || 15;
    STATE.matchupsByWeek = {};
    const weekPromises = [];
    for (let w = 1; w < STATE.currentWeek && w <= totalWeeks; w++) {
      weekPromises.push(
        sleeperGet(`/league/${lg.league_id}/matchups/${w}`)
          .then(data => { STATE.matchupsByWeek[w] = data || []; })
          .catch(() => { STATE.matchupsByWeek[w] = []; })
      );
    }
    await Promise.all(weekPromises);

    setProgress(60, 'Fetching transactions (all weeks)…');
    STATE.transactions = [];
    STATE.auctionCosts = {};
    try {
      const txWeeks = Math.max(1, STATE.currentWeek);
      const txPromises = [];
      for (let w = 1; w <= txWeeks; w++) {
        txPromises.push(
          sleeperGet(`/league/${lg.league_id}/transactions/${w}`)
            .then(data => { if (Array.isArray(data)) STATE.transactions.push(...data); })
            .catch(() => {})
        );
      }
      await Promise.all(txPromises);

      // Fetch prev season startup auction costs from draft picks + transactions
      const prevId = lg.previous_league_id;
      if (prevId && prevId !== '0') {
        try {
          // Step 1: pull startup auction costs from prev season draft picks endpoint
          const prevDrafts = await sleeperGet(`/league/${prevId}/drafts`);
          if (Array.isArray(prevDrafts) && prevDrafts.length) {
            for (const draft of prevDrafts) {
              if (!draft.draft_id) continue;
              const picks = await sleeperGet(`/draft/${draft.draft_id}/picks`);
              if (!Array.isArray(picks)) continue;
              picks.forEach(pick => {
                const pid = pick.player_id ? String(pick.player_id) : null;
                const cost = pick.metadata?.amount !== undefined ? Number(pick.metadata.amount) : null;
                const rid = pick.roster_id || null;
                // v4.2: Sleeper's pick.is_keeper is true/false/null — capture it so keeper leagues
                // can distinguish "kept from last season" vs "freshly drafted/auctioned" per player.
                const isKeeper = pick.is_keeper === true ? true : (pick.is_keeper === false ? false : null);
                if (pid && cost !== null && !STATE.auctionCosts[pid]) {
                  STATE.auctionCosts[pid] = { cost, roster_id: rid, is_keeper: isKeeper };
                }
                // v2.3: draft capital (round/pick_no/draft_slot) — prior season draft, walked back via previous_league_id
                if (pid && pick.round !== undefined && pick.round !== null && !STATE.draftedPicks[pid]) {
                  STATE.draftedPicks[pid] = {
                    season: draft.season || null,
                    round: pick.round,
                    pick_no: pick.pick_no ?? null,
                    draft_slot: pick.draft_slot ?? null,
                    draft_type: draft.type || null, // v2.4: 'snake' | 'auction' | 'linear' — distinguishes vet-auction picks from real draft capital
                  };
                }
              });
            }
          }
          // Step 2: also scan prev season transactions for in-season auction adds
          const prevLeagueInfo = await sleeperGet(`/league/${prevId}`);
          const prevWeeks = prevLeagueInfo?.settings?.playoff_week_start || 18;
          const prevTxPromises = [];
          const prevTxs = [];
          for (let w = 1; w <= prevWeeks; w++) {
            prevTxPromises.push(
              sleeperGet(`/league/${prevId}/transactions/${w}`)
                .then(data => { if (Array.isArray(data)) prevTxs.push(...data); })
                .catch(() => {})
            );
          }
          await Promise.all(prevTxPromises);
          prevTxs.forEach(tx => {
            if (tx.settings?.waiver_bid !== undefined && tx.adds) {
              for (const [pid, rid] of Object.entries(tx.adds)) {
                // v4.2: FAAB/waiver adds are never keeper designations — explicit false, not null,
                // so consumers can tell "confirmed not a keeper pick" from "unknown".
                if (!STATE.auctionCosts[pid]) STATE.auctionCosts[pid] = { cost: tx.settings.waiver_bid, roster_id: rid, is_keeper: false };
              }
            }
            if (tx.metadata?.nominated_by && tx.adds) {
              for (const [pid, rid] of Object.entries(tx.adds)) {
                const cost = tx.metadata?.amount !== undefined ? Number(tx.metadata.amount) : null;
                if (cost !== null && !STATE.auctionCosts[pid]) STATE.auctionCosts[pid] = { cost, roster_id: rid, is_keeper: false };
              }
            }
          });
        } catch(e) { /* prev season auction fetch is best-effort */ }
      }

      // Extract auction costs from current season transactions
      STATE.transactions.forEach(tx => {
        if (tx.settings?.waiver_bid !== undefined && tx.adds) {
          for (const [pid, rid] of Object.entries(tx.adds)) {
            STATE.auctionCosts[pid] = { cost: tx.settings.waiver_bid, roster_id: rid, is_keeper: false };
          }
        }
        if (tx.metadata?.nominated_by && tx.adds) {
          for (const [pid, rid] of Object.entries(tx.adds)) {
            const cost = tx.metadata?.amount !== undefined ? Number(tx.metadata.amount) : null;
            if (cost !== null) STATE.auctionCosts[pid] = { cost, roster_id: rid, is_keeper: false };
          }
        }
      });
    } catch(e) { STATE.transactions = []; }

    setProgress(70, 'Fetching draft picks…');
    try {
      const drafts = await sleeperGet(`/league/${lg.league_id}/drafts`);
      STATE.draftInfo = drafts && drafts.length ? drafts[0] : null;
      if (STATE.draftInfo) {
        STATE.tradedPicks = await sleeperGet(`/league/${lg.league_id}/traded_picks`);

        // Pull current season auction picks — this is where TECMO-style auction costs live
        try {
          const currentPicks = await sleeperGet(`/draft/${STATE.draftInfo.draft_id}/picks`);
          if (Array.isArray(currentPicks)) {
            currentPicks.forEach(pick => {
              const pid = pick.player_id ? String(pick.player_id) : null;
              // Auction cost lives in metadata.amount
              const cost = pick.metadata?.amount !== undefined ? Number(pick.metadata.amount) : null;
              const rid = pick.roster_id || null;
              // v4.2: this year's is_keeper flag — the actual signal for "which players were
              // designated as keepers in THIS offseason's draft/auction," not just cost history.
              const isKeeper = pick.is_keeper === true ? true : (pick.is_keeper === false ? false : null);
              if (pid && cost !== null) {
                // Current season picks override prev season — always write
                STATE.auctionCosts[pid] = { cost, roster_id: rid, is_keeper: isKeeper };
              }
              // v2.3: draft capital — current season picks always override prior season
              if (pid && pick.round !== undefined && pick.round !== null) {
                STATE.draftedPicks[pid] = {
                  season: lg.season || STATE.currentSeason || null,
                  round: pick.round,
                  pick_no: pick.pick_no ?? null,
                  draft_slot: pick.draft_slot ?? null,
                  draft_type: STATE.draftInfo?.type || null, // v2.4
                };
              }
            });
          }
        } catch(e) { /* current season draft picks fetch best-effort */ }
      }
    } catch(e) { STATE.tradedPicks = []; }

    setProgress(82, `Fetching prior season stats (${STATE.statsSeason})…`);
    // Fetch all 18 weeks of prior season stats and accumulate per player
    STATE.playerStats = {};
    STATE.playerStatSplits = {};
    STATE.weeklyPts = {}; // v2.8: pid -> { week: pts }, retained for trend tracking
    const SPLIT_KEYS = ['rush_att','rush_yd','rec_tgt','rec','rec_yd','snap_cnt','pass_att','pass_cmp','pass_yd','pass_td','pass_int','idp_tkl_solo','idp_tkl_ast','idp_tkl_loss','idp_sack','idp_int','idp_ff','idp_pass_def','idp_qb_hit','idp_fum_rec','kr_yd','pr_yd'];
    const statsWeekPromises = [];
    for (let w = 1; w <= 18; w++) {
      statsWeekPromises.push(
        fetchStats(STATE.statsSeason, w)
          .then(weekData => {
            for (const [pid, statsObj] of Object.entries(weekData)) {
              const pts = scoreStats(statsObj, STATE.scoringMap);
              if (pts > 0) {
                STATE.playerStats[pid] = (STATE.playerStats[pid] || 0) + pts;
              }
              // v2.8: retain per-week pts (only for weeks the player actually played,
              // using the same 'gp' signal preferred elsewhere over key-presence)
              // v3.7: key-presence fallback restricted to positions we track stats for (see
              // isTrackedStatPosition) — untracked positions (OL/FB/LS/etc.) require explicit gp.
              // v4.0 fix: same corroborating-production requirement as the season-history loop
              // (see detailed comment there) — Sleeper's gp flag alone isn't a reliable signal
              // for players who missed the week/season on IR.
              const posForGP = STATE.playerDB?.[pid]?.position;
              const posKeyForGP = posForGP === 'DE' || posForGP === 'DT' ? 'DL' : posForGP === 'CB' ? 'DB' : posForGP;
              const trackedKeysForGP = POS_STAT_KEYS[posKeyForGP] || SPLIT_KEYS;
              const hasStatProduction = trackedKeysForGP.some(k => Number(statsObj[k]) > 0);
              // v4.3: DEF carve-out — see detailed comment in the season-history loop above.
              const didPlay = posKeyForGP === 'DEF'
                ? (statsObj.gp !== undefined ? statsObj.gp > 0 : true)
                : statsObj.gp !== undefined
                  ? (statsObj.gp > 0 && hasStatProduction)
                  : (isTrackedStatPosition(posForGP) && hasStatProduction);
              if (didPlay) {
                if (!STATE.weeklyPts[pid]) STATE.weeklyPts[pid] = {};
                STATE.weeklyPts[pid][w] = pts;
              }
              // Accumulate raw splits regardless of scored pts (IDP may score via keys not in pts)
              for (const key of SPLIT_KEYS) {
                if (statsObj[key]) {
                  if (!STATE.playerStatSplits[pid]) STATE.playerStatSplits[pid] = {};
                  STATE.playerStatSplits[pid][key] = (STATE.playerStatSplits[pid][key] || 0) + statsObj[key];
                }
              }
            }
          })
          .catch(() => {})
      );
    }
    await Promise.all(statsWeekPromises);
    // Round accumulated totals
    for (const pid of Object.keys(STATE.playerStats)) {
      STATE.playerStats[pid] = Math.round(STATE.playerStats[pid] * 100) / 100;
    }
    // Round weekly pts (v2.8)
    for (const pid of Object.keys(STATE.weeklyPts)) {
      for (const w of Object.keys(STATE.weeklyPts[pid])) {
        STATE.weeklyPts[pid][w] = Math.round(STATE.weeklyPts[pid][w] * 100) / 100;
      }
    }
    // Round splits
    for (const pid of Object.keys(STATE.playerStatSplits)) {
      for (const key of Object.keys(STATE.playerStatSplits[pid])) {
        STATE.playerStatSplits[pid][key] = Math.round(STATE.playerStatSplits[pid][key] * 10) / 10;
      }
    }

    // v2.1: Fetch 3-season games-played + pts history (current statsSeason + 2 prior) for durability tracking
    setProgress(88, 'Fetching multi-season history (durability)…');
    STATE.statsHistory = {};
    const histSeasons = [
      parseInt(STATE.statsSeason),
      parseInt(STATE.statsSeason) - 1,
      parseInt(STATE.statsSeason) - 2,
    ];
    // v2.2: stat keys to accumulate per player per season (union of all positions; buildDurabilityProfile filters by pos)
    // v4.4: added DEF fields (sack/int/fum_rec/ff/safe/blk_kick/def_td) — the v4.3 patch added these to
    // POS_STAT_KEYS (which selects which keys get output) but missed adding them here too, so nothing
    // was ever being summed into them; season_stat_history.stats for DEF was showing all zeros as a result.
    const ACCUM_STAT_KEYS = ['pass_yd','pass_td','pass_int','rush_att','rush_yd','rush_td','rec','rec_yd','rec_td',
      'idp_tkl_solo','idp_tkl_ast','idp_sack','idp_int','idp_ff','fgm','fga','xpm','kr_yd','pr_yd',
      'sack','int','fum_rec','ff','safe','blk_kick','def_td']; // v3.5: added kr_yd/pr_yd
    for (const seasonYear of histSeasons) {
      const seasonStr = String(seasonYear);
      const seasonGP = {};   // pid -> games played count for this season
      const seasonPts = {};  // pid -> accumulated pts for this season
      const seasonStatAcc = {}; // v2.2: pid -> accumulated stat fields
      const weekPromises = [];
      for (let w = 1; w <= 18; w++) {
        weekPromises.push(
          fetchStats(seasonStr, w)
            .then(weekData => {
              for (const [pid, statsObj] of Object.entries(weekData)) {
                if (!statsObj) continue;
                // v2.1 fix: Sleeper's stats payload includes a real 'gp' field (games played).
                // Prefer that over inferring "played" from key presence, which can be tripped
                // by stray/garbage entries (e.g. special-teams-only snaps) for games a player
                // didn't actually suit up for. Fall back to key-presence only if 'gp' is absent.
                // v3.7: that key-presence fallback is now restricted to positions we track stats
                // for (isTrackedStatPosition). Untracked positions (OL/FB/LS/G/T/C/NT/P) lack a
                // 'gp' field entirely in Sleeper's payload, and a non-empty stats object for them
                // does not reliably mean the player suited up — so no 'gp' now means no count,
                // and games_played_history correctly falls through to null (see buildDurabilityProfile).
                // v4.0 fix: Sleeper's 'gp' flag was found to be unreliable for players who missed
                // most/all of a season on IR — it can read gp=1 for a given week even though the
                // player recorded zero on-field production, apparently reflecting that the player's
                // TEAM had a game that week rather than that the player himself took the field.
                // Confirmed case: a player who suffered a Week 1 season-ending injury and played in
                // exactly 1 game still had every one of the season's 17 weeks counted as "played,"
                // massively overstating durability and games_played_history for that season.
                // Fix: gp>0 alone is no longer sufficient. For tracked positions, also require at
                // least one nonzero tracked stat that week as corroborating evidence of actual
                // participation. This only affects games with zero recorded production; a real
                // shutout game with genuine snaps almost always still produces at least one tracked
                // stat (a tackle, a target, a snap-adjacent stat), so false negatives are rare, while
                // this closes off the systematic false-positive for injured/inactive players.
                const posForGP = STATE.playerDB?.[pid]?.position;
                const posKeyForGP = posForGP === 'DE' || posForGP === 'DT' ? 'DL' : posForGP === 'CB' ? 'DB' : posForGP;
                const trackedKeysForGP = POS_STAT_KEYS[posKeyForGP] || SPLIT_KEYS;
                const hasStatProduction = trackedKeysForGP.some(k => Number(statsObj[k]) > 0);
                // v4.3: team defenses (DEF) can legitimately record zero of the tracked
                // box-score events (sack/int/fum_rec/ff/safe/blk_kick/def_td) in a real,
                // fully-played game. Unlike an individual player, a unit can't be
                // "inactive," so gp alone is a reliable played signal for this position —
                // requiring production corroboration here was silently zeroing out every
                // DEF's games_played_history/pts_history/season_stat_history.
                const didPlay = posKeyForGP === 'DEF'
                  ? (statsObj.gp !== undefined ? statsObj.gp > 0 : true)
                  : statsObj.gp !== undefined
                    ? (statsObj.gp > 0 && hasStatProduction)
                    : (isTrackedStatPosition(posForGP) && hasStatProduction);
                if (didPlay) {
                  seasonGP[pid] = (seasonGP[pid] || 0) + 1;
                  const pts = scoreStats(statsObj, STATE.scoringMap);
                  seasonPts[pid] = (seasonPts[pid] || 0) + pts;
                  // v2.2: accumulate position-relevant stat fields
                  if (!seasonStatAcc[pid]) seasonStatAcc[pid] = {};
                  for (const k of ACCUM_STAT_KEYS) {
                    if (statsObj[k]) seasonStatAcc[pid][k] = (seasonStatAcc[pid][k] || 0) + statsObj[k];
                  }
                }
              }
            })
            .catch(() => {})
        );
      }
      await Promise.all(weekPromises);
      for (const pid of new Set([...Object.keys(seasonGP), ...Object.keys(seasonPts)])) {
        if (!STATE.statsHistory[pid]) STATE.statsHistory[pid] = {};
        STATE.statsHistory[pid][seasonStr] = {
          gp: seasonGP[pid] || 0,
          pts: Math.round((seasonPts[pid] || 0) * 100) / 100,
          acc: seasonStatAcc[pid] || {}, // v2.2: accumulated stats (filtered by pos in buildDurabilityProfile)
        };
      }
    }

    setProgress(93, 'Fetching projections…');
    const projWeek = Math.max(1, Math.min(STATE.currentWeek, 18));
    const rawProj = await fetchProjections(STATE.currentSeason, projWeek);
    STATE.projections = {};
    for (const [pid, stats] of Object.entries(rawProj)) {
      STATE.projections[pid] = scoreStats(stats, STATE.scoringMap);
    }

    setProgress(95, 'Fetching season projections…');
    const seasonProjResult = await fetchSeasonProjections(STATE.currentSeason, STATE.scoringMap);
    STATE.seasonProjections = seasonProjResult.map;
    STATE.seasonProjectionMeta = seasonProjResult.meta;

    setProgress(97, 'Fetching prior season data…');
    STATE.prevSeasonData = { standings: [], matchups: {}, leagueId: null, rosters: [], users: {} };
    await fetchPriorSeasonData(lg);

    setProgress(100, 'Done!');
    setTimeout(() => {
      hideProgress();
      renderDashboard();
    }, 300);
  } catch(err) {
    hideProgress();
    alert('Error loading league: ' + (err.message || err));
  }
}
